<script>
/* ================= QUEM MATOU? (puzzle de dedução, offline) =================
   Planta N×N dividida em divisões. Há N pessoas (N-1 suspeitos + a vítima), uma por linha e uma por coluna.
   Ninguém pode estar num quadrado com móvel "bloqueado" (mesa, planta…). A vítima fica no único lugar que sobra.
   O assassino é o único suspeito que estava na mesma divisão que a vítima.
   O gerador só aceita casos com uma única solução (verificada por um solucionador). */
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hashStr=s=>{let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
/* ---------- dados ---------- */
const OBJ={mesa:{n:"mesa",g:"f",b:1},planta:{n:"planta",g:"f",b:1},tv:{n:"televisão",g:"f",b:1},fogao:{n:"fogão",g:"m",b:1},barril:{n:"barril",g:"m",b:1},estante:{n:"estante",g:"f",b:1},piano:{n:"piano",g:"m",b:1},lareira:{n:"lareira",g:"f",b:1},arca:{n:"arca",g:"f",b:1},
  cadeira:{n:"cadeira",g:"f"},tapete:{n:"tapete",g:"m"},banco:{n:"banco",g:"m"},sofa:{n:"sofá",g:"m"},cama:{n:"cama",g:"f"}};
const THEMES=[
 {name:"Tasca do Zé",rooms:["o Balcão","a Sala","a Cozinha","a Despensa","a Esplanada","a Casa de banho"],block:["mesa","barril","planta","fogao","tv"],sit:["cadeira","tapete","banco"]},
 {name:"Solar da Quinta",rooms:["a Biblioteca","o Salão","a Cozinha","o Quarto","o Jardim","o Escritório"],block:["estante","mesa","planta","piano","lareira"],sit:["cadeira","sofa","tapete","banco"]},
 {name:"Casa da Avó",rooms:["a Sala","a Cozinha","o Quarto","a Marquise","o Quintal","o Corredor"],block:["mesa","planta","tv","fogao","arca"],sit:["cadeira","sofa","tapete","banco"]}];
const PEOPLE=[["Dona Amélia","f"],["Sr. Joaquim","m"],["Tia Lurdes","f"],["Zé Manel","m"],["Inês","f"],["Rui","m"],["Fernanda","f"],["Padre Abílio","m"],["Graça","f"],["Tó","m"],["Prima Sónia","f"],["Tio Armando","m"]];
const VICTIMS=[["o Sr. Albano","m"],["a Dona Custódia","f"],["o Comendador Vasco","m"],["a Madrinha Rosa","f"]];
const PCOL=["#e0483e","#2a62c4","#4f9f2f","#ff9f1c","#8a5cd6","#d23a6e","#1f8a7d","#8a5a2b"];
const ROOMC=["#ffe3b3","#d6ecff","#e2f5c8","#ffd6e2","#ece0ff","#d9f3ef"];
const DIFF={f:{n:4,name:"Fácil"},m:{n:5,name:"Médio"},d:{n:6,name:"Difícil"}};
const art=(g,a)=>a==="em"?(g==="f"?"numa":"num"):(g==="f"?"uma":"um");
const roomIn=r=>(r.startsWith("a ")?"na ":"no ")+r.slice(2);
/* ---------- gerador ---------- */
function makeHouse(n,R,theme){
  const k=n-1;
  for(let tries=0;tries<200;tries++){
    const room=Array.from({length:n},()=>Array(n).fill(-1)),cells=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)cells.push([r,c]);
    const seeds=[];while(seeds.length<k){const p=cells[Math.floor(R()*cells.length)];if(!seeds.some(s=>Math.abs(s[0]-p[0])+Math.abs(s[1]-p[1])<2))seeds.push(p)}
    seeds.forEach((s,i)=>room[s[0]][s[1]]=i);
    let left=n*n-k,guard=0;
    while(left>0&&guard++<5000){const i=Math.floor(R()*k);const own=cells.filter(([r,c])=>room[r][c]===i);const [r,c]=own[Math.floor(R()*own.length)];const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(R()*4)];const nr=r+d[0],nc=c+d[1];if(nr>=0&&nc>=0&&nr<n&&nc<n&&room[nr][nc]<0){room[nr][nc]=i;left--}}
    if(left>0)continue;
    const sizes=Array(k).fill(0);room.flat().forEach(i=>sizes[i]++);if(Math.min(...sizes)<3)continue;
    const obj=room.map(row=>row.map(()=>{const x=R();return x<.2?theme.block[Math.floor(R()*theme.block.length)]:x<.4?theme.sit[Math.floor(R()*theme.sit.length)]:null}));
    return{room,obj};
  }
  return null;
}
const free=(H,r,c)=>!(H.obj[r][c]&&OBJ[H.obj[r][c]].b);
function generate(diff,seed){
  const n=DIFF[diff].n,R=rng(seed);
  for(let attempt=0;attempt<400;attempt++){
    const theme=THEMES[Math.floor(R()*THEMES.length)],H=makeHouse(n,R,theme);if(!H)continue;
    /* solução: permutação; a vítima numa das linhas */
    const perm=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(R()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
    if(perm.some((c,r)=>!free(H,r,c)))continue;
    const vr=Math.floor(R()*n),V=[vr,perm[vr]],vroom=H.room[V[0]][V[1]];
    const pos=[];for(let r=0;r<n;r++)if(r!==vr)pos.push([r,perm[r]]);
    /* mistura a ordem dos suspeitos */
    for(let i=pos.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]]}
    const inV=pos.filter(p=>H.room[p[0]][p[1]]===vroom);if(inV.length!==1)continue;
    const names=[...PEOPLE];for(let i=names.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[names[i],names[j]]=[names[j],names[i]]}
    const P={n,diff,seed,theme:theme.name,rooms:[...theme.rooms].sort(()=>R()-.5).slice(0,n-1),H,sol:pos,V,victim:VICTIMS[Math.floor(R()*VICTIMS.length)],people:names.slice(0,n-1),killer:pos.indexOf(inV[0])};
    const clues=makeClues(P,R);if(!clues)continue;
    P.clues=clues;return P;
  }
  throw new Error("sem caso");
}
function candClues(P,R){
  const {H,sol,n}=P,out=[];
  sol.forEach(([r,c],s)=>{
    const rm=H.room[r][c],o=H.obj[r][c];
    out.push({t:"room",s,R:rm,w:3});
    for(let k=0;k<n-1;k++)if(k!==rm)out.push({t:"notroom",s,R:k,w:1});
    if(o)out.push({t:"on",s,o,w:3});else out.push({t:"floor",s,w:2});
    const seen=new Set();for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=r+dr,b=c+dc;if(a<0||b<0||a>=n||b>=n)continue;const ob=H.obj[a][b];if(ob&&OBJ[ob].b&&!seen.has(ob)){seen.add(ob);out.push({t:"adj",s,o:ob,w:2})}}
    if(r===0)out.push({t:"wall",s,side:"cima",w:2});if(r===n-1)out.push({t:"wall",s,side:"baixo",w:2});if(c===0)out.push({t:"wall",s,side:"esquerda",w:2});if(c===n-1)out.push({t:"wall",s,side:"direita",w:2});
    sol.forEach(([r2,c2],s2)=>{if(s2<=s)return;const same=H.room[r2][c2]===rm;out.push({t:same?"same":"diff",s,s2,w:same?2:1});
      if(Math.abs(r-r2)>0)out.push({t:"above",s:r<r2?s:s2,s2:r<r2?s2:s,w:1})});
  });
  return out.map(x=>({...x,k:R()*x.w}));
}
function okClue(cl,pos,H){
  const [r,c]=pos[cl.s];
  switch(cl.t){
    case"room":return H.room[r][c]===cl.R;case"notroom":return H.room[r][c]!==cl.R;case"on":return H.obj[r][c]===cl.o;case"floor":return!H.obj[r][c];
    case"adj":return[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const x=r+a,y=c+b;return x>=0&&y>=0&&x<H.room.length&&y<H.room.length&&H.obj[x][y]===cl.o});
    case"wall":{const n=H.room.length;return cl.side==="cima"?r===0:cl.side==="baixo"?r===n-1:cl.side==="esquerda"?c===0:c===n-1}
    case"same":{const p=pos[cl.s2];return p&&H.room[r][c]===H.room[p[0]][p[1]]}
    case"diff":{const p=pos[cl.s2];return p&&H.room[r][c]!==H.room[p[0]][p[1]]}
    case"above":{const p=pos[cl.s2];return p&&r<p[0]}
  }return true;
}
const unary=t=>!["same","diff","above"].includes(t);
/* conta soluções (até 2) */
function solve(P,clues,limit=2){
  const {H,n}=P,m=n-1,dom=[];
  for(let s=0;s<m;s++){const u=clues.filter(c=>c.s===s&&unary(c.t)),d=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(!free(H,r,c))continue;const pos=[];pos[s]=[r,c];if(u.every(cl=>okClue(cl,pos,H)))d.push([r,c])}dom.push(d)}
  const order=[...Array(m).keys()].sort((a,b)=>dom[a].length-dom[b].length);
  const bin=clues.filter(c=>!unary(c.t));
  let count=0,first=null;const pos=[],ur=Array(n).fill(0),uc=Array(n).fill(0);
  (function bt(i){
    if(count>=limit)return;
    if(i===m){
      const vr=ur.indexOf(0),vc=uc.indexOf(0);if(!free(H,vr,vc))return;
      const vroom=H.room[vr][vc],inV=pos.filter(p=>H.room[p[0]][p[1]]===vroom).length;if(inV!==1)return;
      if(!bin.every(cl=>okClue(cl,pos,H)))return;
      count++;if(!first)first=pos.map(p=>p.slice());return;
    }
    const s=order[i];
    for(const [r,c] of dom[s]){if(ur[r]||uc[c])continue;pos[s]=[r,c];ur[r]=1;uc[c]=1;
      const okb=bin.every(cl=>{if(pos[cl.s]===undefined||pos[cl.s2]===undefined)return true;return okClue(cl,pos,H)});
      if(okb)bt(i+1);ur[r]=0;uc[c]=0;pos[s]=undefined;if(count>=limit)return}
  })(0);
  return{count,first};
}
function makeClues(P,R){
  const cand=candClues(P,R).sort((a,b)=>b.k-a.k);
  const easy=P.diff==="f";
  /* prefere pistas "diretas" no fácil e indiretas no difícil */
  if(P.diff==="d")cand.sort((a,b)=>(a.t==="room"||a.t==="on")-(b.t==="room"||b.t==="on")||b.k-a.k);
  let chosen=[];
  for(const c of cand){chosen.push(c);if(chosen.length>=P.n-1&&solve(P,chosen).count===1)break}
  if(solve(P,chosen).count!==1)return null;
  /* tira pistas a mais (sem deixar ninguém sem pista) */
  const keepExtra=easy?1:0;let removed=0;
  for(const c of [...chosen].reverse()){
    const rest=chosen.filter(x=>x!==c);
    const per=new Set(rest.flatMap(x=>x.s2!==undefined?[x.s,x.s2]:[x.s]));
    if(per.size<P.n-1)continue;
    if(solve(P,rest).count===1){chosen=rest;removed++}
  }
  if(keepExtra){const extra=cand.find(c=>!chosen.includes(c)&&(c.t==="room"||c.t==="on"));if(extra)chosen.push(extra)}
  if(chosen.length>P.n+5)return null;
  return chosen.sort((a,b)=>a.s-b.s);
}
function clueText(cl,P){
  const nm=s=>`<b style="color:${PCOL[s]}">${P.people[s][0]}</b>`,o=cl.o&&OBJ[cl.o];
  switch(cl.t){
    case"room":return`${nm(cl.s)} estava ${roomIn(P.rooms[cl.R])}.`;
    case"notroom":return`${nm(cl.s)} não estava ${roomIn(P.rooms[cl.R])}.`;
    case"on":return`${nm(cl.s)} estava ${art(o.g,"em")} ${o.n}.`;
    case"floor":return`${nm(cl.s)} estava de pé, sem nenhum móvel debaixo.`;
    case"adj":return`${nm(cl.s)} estava mesmo ao lado de ${art(o.g)} ${o.n}.`;
    case"wall":return`${nm(cl.s)} estava encostad${P.people[cl.s][1]==="f"?"a":"o"} à parede ${cl.side==="cima"?"de cima":cl.side==="baixo"?"de baixo":"da "+cl.side}.`;
    case"same":return`${nm(cl.s)} e ${nm(cl.s2)} estavam na mesma divisão.`;
    case"diff":return`${nm(cl.s)} e ${nm(cl.s2)} estavam em divisões diferentes.`;
    case"above":return`${nm(cl.s)} estava mais acima na planta do que ${nm(cl.s2)}.`;
  }
}

<script>/* ===== Ecrã completo (menu e todos os jogos) =====
   O navegador sai do ecrã completo sempre que muda de página. Para não sair ao andar entre jogos,
   quando se está em ecrã completo os links do site abrem por cima, numa moldura (iframe) que ocupa o ecrã todo:
   a página de fora nunca muda e o ecrã completo mantém-se. O endereço e o botão "voltar" continuam a funcionar.
   A escolha fica guardada; se mesmo assim se mudar de página, volta a entrar no primeiro toque. */
(function(){
  const TOP=(()=>{try{return window.top!==window&&window.top.JFS&&window.top.JFS.shell?window.top:null}catch(e){return null}})();
  const D=TOP?TOP.document:document,de=D.documentElement;
  const can=!!(D.fullscreenEnabled||D.webkitFullscreenEnabled);
  const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
  /* app instalada em ecrã completo: já está tudo no ecrã, o botão não faz falta */
  const APPFS=matchMedia("(display-mode: fullscreen)").matches;
  /* app instalada que ainda abre com as barras (o Chrome demora a atualizar a app): entra em ecrã completo no primeiro toque,
     sempre que se abre a app (a escolha de sair só dura até fechar a app) */
  const APPSA=!APPFS&&(matchMedia("(display-mode: standalone)").matches||navigator.standalone===true);
  const get=()=>{if(APPFS)return false;try{if(APPSA){const v=sessionStorage.getItem("pp-fs-app");return v!=="0"}return localStorage.getItem("pp-fs")==="1"}catch(e){return APPSA}};
  const set=v=>{try{if(APPSA)sessionStorage.setItem("pp-fs-app",v?"1":"0");else localStorage.setItem("pp-fs",v?"1":"0")}catch(e){}};
  const enter=()=>{try{const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)return p.catch(()=>{});return Promise.resolve()}catch(e){return Promise.resolve()}};
  const leave=()=>{try{if(!isFs())return;const p=(D.exitFullscreen||D.webkitExitFullscreen).call(D);if(p&&p.catch)p.catch(()=>{})}catch(e){}};

  JFS.lockOr=o=>{const sc=(TOP||window).screen;return sc.orientation&&sc.orientation.lock?sc.orientation.lock(o):Promise.reject()};
  JFS.unlockOr=()=>{try{const sc=(TOP||window).screen;sc.orientation&&sc.orientation.unlock&&sc.orientation.unlock()}catch(e){}};
  /* ir para o menu (passa pela moldura se for caso disso) */
  JFS.home=()=>{const a=document.createElement("a");a.href=new URL("../",location.href).href;a.style.display="none";document.body.appendChild(a);a.click();a.remove()};

  /* ---- links do site ---- */
  const sameSite=a=>{
    if(!a||a.target&&a.target!=="_self"||a.hasAttribute("download"))return null;
    let u;try{u=new URL(a.href,location.href)}catch(e){return null}
    if(u.origin!==location.origin)return null;
    if(u.href.split("#")[0]===location.href.split("#")[0])return null; /* só muda o # */
    return u.href;
  };
  if(TOP){
    /* dentro da moldura: os links vão para a página de fora tratar */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();TOP.JFS.go(h)},false);
  }else{
    JFS.shell=true;
    const HOME=location.href.split("#")[0],baseTitle=document.title;let fr=null,bk=null,syncT=0;
    /* a zona da câmara e da barra de baixo fica com a mesma cor e padrão do jogo que está aberto */
    const meta=document.querySelector('meta[name="theme-color"]');
    const sync=()=>{try{const d=fr.contentDocument;if(!d||!d.body)return;const pl=d.getElementById("play");const el=pl&&!pl.hidden?pl:d.body;const cs=getComputedStyle(el);let bg=cs.backgroundColor;if(el===d.body&&(bg==="rgba(0, 0, 0, 0)"||bg==="transparent"))bg=getComputedStyle(d.documentElement).backgroundColor;
      bk.style.backgroundColor=bg;bk.style.backgroundImage=cs.backgroundImage;bk.style.backgroundSize=cs.backgroundSize;if(meta)meta.content=bg}catch(e){}};
    const close=()=>{if(!fr)return;clearInterval(syncT);fr.remove();fr=null;if(bk){bk.remove();bk=null}document.documentElement.style.overflow="";document.title=baseTitle};

      if(!fr){

        fr.allow="fullscreen; web-share; clipboard-write; accelerometer; gyroscope; autoplay; screen-wake-lock";fr.setAttribute("allowfullscreen","");
        /* dentro de uma moldura o env(safe-area-inset-*) vale 0, por isso é a moldura que fica fora da câmara e dos cantos */fr.style.cssText="position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg,#f4eee3)";bk=document.createElement("div");bk.style.cssText="position:fixed;inset:0;z-index:2147483000;background:var(--bg,#f4eee3)";document.body.appendChild(bk);
        fr.src=href;bk.appendChild(fr);document.documentElement.style.overflow="hidden";

    if(!document.querySelector("nav.games")&&document.querySelector('a[href="../"]')){
      const HUB=new URL("../",location.href).href,ref=(document.referrer||"").split("#")[0];
      if(ref!==HUB&&!(history.state&&history.state.jg)){const here=location.href;try{history.replaceState({jhub:1},"",HUB);history.pushState({jg:1},"",here)}catch(e){}}
      addEventListener("popstate",e=>{if(e.state&&e.state.jhub)location.replace(HUB)});
    }
    /* em ecrã completo, os links do site abrem na moldura */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;if(!isFs()&&!fr&&!get())return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();JFS.go(h)},false);
  }
  if(!can||APPFS)return;

  /* ---- botão ---- */
  const IN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  let btn=document.getElementById("fsBtn");
  if(btn){const c=btn.cloneNode(false);c.removeAttribute("aria-pressed");btn.replaceWith(c);btn=c} /* a Panela tinha o seu; passa a usar este */
  else{
    const tools=document.querySelector("header .tools");if(!tools)return;
    btn=document.createElement("button");btn.className="btn ghost sm ico";btn.id="fsBtn";btn.type="button";
    const tb=document.getElementById("themeBtn");tools.insertBefore(btn,tb||null);
  }
  const st=document.createElement("style");
  st.textContent="#fsBtn{display:inline-grid;place-items:center}#fsBtn[hidden]{display:none}#fsBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}";
  document.head.appendChild(st);
  const upd=()=>{const f=isFs();btn.innerHTML=f?OUT:IN;btn.title=f?"Sair do ecrã completo":"Ecrã completo";btn.setAttribute("aria-label",btn.title);if(window.dispatchEvent)setTimeout(()=>dispatchEvent(new Event("resize")),250)};
  upd();D.addEventListener("fullscreenchange",upd);D.addEventListener("webkitfullscreenchange",upd);
  btn.hidden=false;
  btn.addEventListener("click",()=>{const f=isFs();set(!f);f?leave():enter()});
  if(TOP)return;
  /* guardar a escolha */
  let leaving=false;addEventListener("pagehide",()=>{leaving=true});
  const onChange=()=>{if(!isFs()&&!leaving&&document.visibilityState==="visible")set(false)};
  document.addEventListener("fullscreenchange",onChange);document.addEventListener("webkitfullscreenchange",onChange);
  /* se mesmo assim mudou de página: volta a entrar no primeiro toque */
  if(get()&&!isFs()){
    const off=()=>{removeEventListener("click",once,true);removeEventListener("touchend",once,true)};
    const once=e=>{if(e.target&&e.target.closest&&e.target.closest("#fsBtn"))return;off();if(!isFs())enter()};
    addEventListener("click",once,true);addEventListener("touchend",once,true);
  }
})();
</script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}))</script></body>
