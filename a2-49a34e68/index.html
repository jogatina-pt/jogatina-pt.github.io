const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function open_(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c));const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close()}
async function fromPw(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},true,["decrypt"])}
addEventListener("load",async()=>{let saved=null;try{saved=localStorage.getItem("a2-key")}catch(e){}
  if(saved){try{const k=await crypto.subtle.importKey("raw",u8(saved),"AES-GCM",false,["decrypt"]);await open_(k);return}catch(e){try{localStorage.removeItem("a2-key")}catch(x){}}}});
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("m");m.textContent="A abrir…";
  try{const k=await fromPw(document.getElementById("pw").value.trim().toLowerCase());
    if(document.getElementById("rem").checked){try{localStorage.setItem("a2-key",b64(await crypto.subtle.exportKey("raw",k)))}catch(x){}}
    await open_(k)}catch(x){m.textContent="Palavra-passe errada."}};
