<style>
/* ipgames: base comum (mesma família visual da Panela de Pressão) */
@font-face{font-family:"Bowlby One";font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/bowlby-one.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(../fonts/figtree.woff2) format("woff2")}
[hidden]{display:none!important}
:root{
  --bg:#13201f; --surface:#1b2d2b; --surface-2:#223835; --line:#2f4744;
  --ink:#eef2ea; --muted:#9fb5af; --title:#f1ece2; --enamel:#f1ece2; --card-ink:#1b2422;
  --accent:#ff8a3d; --accent-ink:#1d130b; --steam:#8fd3c8; --danger:#ff5a4f; --good:#5fd08a;
  --display:"Bowlby One", Impact, "Arial Black", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
:root[data-pp-theme="light"]{
  --bg:#f4eee3; --surface:#fffaf1; --surface-2:#ebe1cf; --line:#d8cab2;
  --ink:#1f2a28; --muted:#5b6965; --title:#1f2a28; --enamel:#fffdf8; --card-ink:#1b2422;
  --accent:#e8731f; --steam:#1d7a6e; --danger:#c8352b; --good:#1f8a4c;
  color-scheme:light;
}
html,body{margin:0}
html{height:100%}
html,body{background:var(--bg);color:var(--ink)}
body{min-height:100%;box-sizing:border-box;overflow-x:hidden;font-family:var(--body);font-size:15px;line-height:1.45;padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column}
.wrap{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--steam);outline-offset:2px}
a{color:inherit}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 20px;font-weight:800;font-size:15px;text-decoration:none;line-height:1.1}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ico{min-width:36px;padding-inline:9px;font-size:15px;line-height:1}
.btn.ico[aria-pressed="false"]{opacity:.45;filter:grayscale(1)}
#exitBtn{border-color:var(--danger);color:var(--danger)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;flex:none}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:clamp(24px,6vw,34px);line-height:1;color:var(--title)}
.brand h1 span{color:var(--accent)}
.brand a.home{font-size:13px;color:var(--muted);text-decoration:none;font-weight:700;white-space:nowrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;box-sizing:border-box;min-width:0}
input:focus,input:focus-visible{outline:none;border-color:var(--steam);box-shadow:inset 0 0 0 1.5px var(--steam)}
.setup{display:flex;flex-direction:column;gap:16px;align-items:flex-start;flex:1;padding-block:12px 24px}
.setup h2{font-size:clamp(34px,10vw,60px);line-height:.95;color:var(--title)}
.setup h2 span{color:var(--accent);display:block}
.setup p{max-width:58ch;color:var(--muted);margin:0}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;width:100%;max-width:360px}
.mode{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px;box-sizing:border-box}
.join{display:flex;gap:8px}
.join input{text-transform:uppercase;letter-spacing:.2em;font-weight:800;flex:1}
.join.fromlink input{border-color:var(--accent)}
.note{font-size:13.5px;color:var(--steam);margin:0;min-height:1.2em}
.note.bad{color:var(--danger);font-weight:700}
.nopeer-msg{display:none;color:var(--muted)}
.mode.nopeer .nopeer-msg{display:block}
.mode.nopeer .choices,.mode.nopeer .join{display:none}
.lobby .code{font-size:clamp(44px,14vw,80px);letter-spacing:.12em;color:var(--accent)}
.roster{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
.roster li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-height:24px}
.roster li.free{border-style:dashed;background:transparent;color:var(--muted)}
.roster .rn{font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.roster .rn em{font-style:normal;font-weight:600;color:var(--muted)}
.roster .rk{font-size:12px;color:var(--muted)}
.roster li.free .rn{font-weight:400}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.foot{font-size:13px;color:var(--muted);margin:4px 0 0}
.modal{position:fixed;inset:0;background:rgba(8,14,13,.72);display:grid;place-items:center;padding:16px;z-index:33;box-sizing:border-box}
.sheet{box-sizing:border-box;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px;max-width:460px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:24px;color:var(--title)}
.sheet .body{color:var(--muted)}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap}
.sheet ul{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px}
.sheet li b{color:var(--ink)}
.alert{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);width:max-content;box-sizing:border-box;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;padding:12px 16px;border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.3);text-align:center;pointer-events:none}
.alert.show{animation:alertin .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes alertin{from{transform:translate(-50%,-20px) scale(.9);opacity:0}to{transform:translateX(-50%);opacity:1}}
.bubble{position:fixed;transform:translate(-50%,-100%);font-size:30px;pointer-events:none;animation:bub 2.6s ease forwards;z-index:26}
@keyframes bub{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.1)}20%{transform:translate(-50%,-100%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%)}}
.reacts{position:fixed;z-index:35;display:grid;grid-template-columns:repeat(3,auto);gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.reacts button{font-size:24px;background:var(--surface-2);border:0;border-radius:10px;padding:4px 9px}
@media (prefers-reduced-motion:reduce){.alert.show,.bubble{animation:none}}
.roster li.free.more{border:0!important;background:transparent;padding:2px 6px;min-height:0;font-size:13px}

/* ===== Estilo banda desenhada (comum a todos os jogos) ===== */
@font-face{font-family:"Bangers";font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/bangers.woff2) format("woff2")}
:root{--display:"Bangers","Bowlby One",Impact,sans-serif;--stroke:#151515;--pop:#ffd23f;--pop-ink:#151515;
  --dots:radial-gradient(rgba(21,21,21,.09) 1.3px,transparent 1.6px)}
:root:not([data-pp-theme="light"]){--stroke:#050807;--dots:radial-gradient(rgba(255,255,255,.06) 1.3px,transparent 1.6px)}
body{background-image:var(--dots);background-size:13px 13px}
h1,h2,h3{font-family:var(--display);letter-spacing:.03em;font-weight:400}
.brand h1{font-size:clamp(30px,8vw,42px);-webkit-text-stroke:1.5px var(--stroke);text-shadow:3px 3px 0 var(--stroke);color:var(--title)}
.brand h1 span{color:var(--accent)}
.setup h2{font-size:clamp(40px,12vw,72px);line-height:.92;text-shadow:3px 3px 0 color-mix(in srgb,var(--stroke) 25%,transparent)}
.btn{border:3px solid var(--stroke)!important;box-shadow:3px 3px 0 var(--stroke);font-family:var(--display);font-size:19px;letter-spacing:.06em;font-weight:400;padding:9px 20px;transition:transform .08s,box-shadow .08s}
.btn.sm{font-size:15px;padding:4px 11px;box-shadow:2px 2px 0 var(--stroke)}
.btn.ico{font-family:var(--body)}
.btn:not(:disabled):active{transform:translate(3px,3px);box-shadow:0 0 0 var(--stroke)}
.btn.ghost{background:var(--surface)}
input{border:3px solid var(--stroke);box-shadow:3px 3px 0 var(--stroke)}
.mode,.roster li,.sheet,.qcard,.bcard,.wordcard,.mucard,.rstep,.board li,.opt,.sub,.wcard,.sent,.jbox,.yourturn,.outbox,.words p,.roles li,.others li,.tally li,.drink,.yn2 p,.rulebar,.vol li,.chips li,.seg button,.age,.foreheads li{border:3px solid var(--stroke)!important;box-shadow:4px 4px 0 var(--stroke)}
.roster li.free{box-shadow:none;border-style:dashed!important}
.chips li,.seg button,.vol li{box-shadow:2px 2px 0 var(--stroke)}
.qcard,.bcard,.wordcard,.mucard{border-radius:18px;box-shadow:6px 6px 0 var(--stroke)}
.opt:not(:disabled):active,.sub:not(:disabled):active,.wcard:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--stroke)}
.lobby .code{-webkit-text-stroke:2px var(--stroke);text-shadow:4px 4px 0 var(--stroke);letter-spacing:.14em}
.win h2,.winbox h2,.outbox h2{-webkit-text-stroke:1.5px var(--stroke);text-shadow:3px 3px 0 var(--stroke)}
.eyebrow{letter-spacing:.12em}
.alert{border:3px solid var(--stroke);box-shadow:5px 5px 0 var(--stroke);font-family:var(--display);font-size:20px;letter-spacing:.05em}
.setup .mascot{width:min(42vw,170px);height:auto;align-self:flex-end;margin:-8px 0 -18px;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.12))}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;width:100%}
.bubble-say{position:relative;background:#fff;color:#151515;border:3px solid #151515;border-radius:18px;padding:8px 12px;font-family:var(--display);font-size:20px;letter-spacing:.04em;box-shadow:3px 3px 0 #151515;max-width:16ch}
.bubble-say::after{content:"";position:absolute;bottom:-14px;right:22px;border:8px solid transparent;border-top:12px solid #151515}

.macaco-mini{width:100%;height:auto;display:block}

:root,:root[data-pp-theme="light"]{--accent:#e0483e;--accent-ink:#fff}
:root:not([data-pp-theme="light"]){--accent:#ff8a80;--accent-ink:#2a0705}
[hidden]{display:none!important}
.wrap{max-width:520px;gap:10px}
.mbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;border:3px solid var(--stroke);box-shadow:4px 4px 0 var(--stroke);border-radius:18px;padding:12px 16px;background:#ffd23f;color:#151515;cursor:pointer;font:inherit}
.mbtn b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.04em}.mbtn small{font-weight:700;color:#4a3a00}
.dsec{display:flex;flex-direction:column;gap:6px}
.dh{display:flex;justify-content:space-between;align-items:center}.dh b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;color:var(--ink);border-bottom:4px solid var(--c)}.dh span{font-weight:800;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.lv{aspect-ratio:1;border:2.5px solid var(--stroke);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:2px 2px 0 var(--stroke)}
.lv span{font-family:var(--display);font-size:18px;line-height:1}.lv small{font-size:8.5px;color:#f2a900;line-height:1;min-height:9px}
.lv.ok{background:color-mix(in srgb,var(--c) 35%,var(--surface))}.lv.lock{opacity:.45;cursor:default;box-shadow:none}
.pbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pbar .nm{font-family:var(--display);font-size:22px;letter-spacing:.04em;flex:1}
.pbar .chip{font-weight:800;font-size:13px;border:2.5px solid var(--stroke);border-radius:999px;padding:2px 10px;background:var(--surface)}
.lot{position:relative;width:min(100%,62dvh,460px);margin:0 auto;padding:10px;box-sizing:border-box;background:#5a6470;border:4px solid #151515;border-radius:16px;box-shadow:6px 6px 0 var(--stroke)}
.board{position:relative;width:100%;aspect-ratio:1;background:#3d444d;border-radius:8px;background-image:linear-gradient(rgba(255,255,255,.14) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.14) 2px,transparent 2px);background-size:calc(100%/6) calc(100%/6);touch-action:none;user-select:none;-webkit-user-select:none}
.exit{position:absolute;right:-14px;top:calc(10px + (100% - 20px)*2/6);height:calc((100% - 20px)/6);width:14px;background:#ffd23f;border:3px solid #151515;border-left:0;border-radius:0 8px 8px 0;display:grid;place-items:center;font-weight:900;font-size:12px;box-sizing:border-box}
.car{position:absolute;left:0;top:0;padding:4px;box-sizing:border-box;cursor:grab;touch-action:none;transition:transform .12s ease}
.car::before{content:"";position:absolute;inset:4px;background:var(--cc);border:3px solid #151515;border-radius:12px;box-shadow:2px 3px 0 rgba(0,0,0,.45)}
.car.drag{transition:none;z-index:5;cursor:grabbing}.car.drag::before{box-shadow:4px 6px 0 rgba(0,0,0,.45)}
.car i{position:absolute;background:rgba(220,240,255,.85);border:2px solid #151515;border-radius:4px}
.car.h .win1{left:22%;top:22%;bottom:22%;width:14%}.car.h .win2{right:16%;top:22%;bottom:22%;width:12%}
.car.v .win1{top:22%;left:22%;right:22%;height:14%}.car.v .win2{bottom:16%;left:22%;right:22%;height:12%}
.car.truck.h .win2{right:10%;width:8%}.car.truck.v .win2{bottom:10%;height:8%}
.car b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:#ffd23f;-webkit-text-stroke:1.5px #151515}
.car.hint::before{box-shadow:0 0 0 5px #ffd23f,2px 3px 0 rgba(0,0,0,.45);animation:hb .5s ease}@keyframes hb{50%{transform:scale(1.05)}}
.acts{display:flex;gap:8px}.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:#151515;color:#fff;border-radius:14px;padding:10px 16px;font-weight:800;max-width:min(92vw,420px);text-align:center}
.ov{position:fixed;inset:0;z-index:80;background:rgba(10,6,2,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.panel{box-sizing:border-box;background:#fffaf1;color:#151515;border:3px solid #151515;box-shadow:6px 6px 0 #151515;border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(360px,100%);text-align:center}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:44px;line-height:.95;color:#151515}.panel p{margin:0;font-weight:700;color:#333}.panel .small{font-size:13px;color:#666}.panel .btn{width:100%}.panel .eyebrow{color:#555}
.stars{font-size:40px;color:#f2a900;letter-spacing:4px}.stars span{color:#ddd}
.rules ol{margin:0;padding-left:20px;text-align:left;display:flex;flex-direction:column;gap:5px;font-weight:600}
@media (max-width:380px){header.top{flex-wrap:nowrap;gap:6px}.brand h1{font-size:26px;white-space:nowrap}.brand a.home{font-size:0}.brand a.home::before{content:"← menu";font-size:12px}.tools{gap:5px}.tools .btn.sm{padding:4px 8px}.grid{grid-template-columns:repeat(6,1fr)}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Engarra<span>fado</span></h1><a class="home" id="hubLink" href="../">← mais jogos</a></div>
    <div class="tools">
      <button class="btn ghost sm ico" id="rulesBtn" type="button" aria-label="Regras" title="Regras">?</button>
      <button class="btn ghost sm ico" id="mute" type="button" aria-pressed="true" aria-label="Som" title="Som">🔊</button>
      <button class="btn ghost sm ico" id="themeBtn" type="button" aria-label="Tema escuro" title="Tema escuro">☾</button>
    </div>
  </header>
  <section id="menuScr" class="setup">
    <p class="foot" style="text-align:left;margin:0">Arrasta os carros para abrir caminho e tira o carro vermelho do parque.</p>
    <button class="mbtn" type="button" id="dailyBtn"></button>
    <div id="levels" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>
  <section id="playScr" hidden style="display:flex;flex-direction:column;gap:10px">
    <div class="pbar"><button class="btn ghost sm" type="button" id="backBtn">← Níveis</button><span class="nm" id="lvName"></span><span class="chip">Jogadas <b id="mv">0</b></span><span class="chip">Mínimo <b id="minv">0</b></span></div>
    <div class="lot"><div class="board" id="board" aria-label="Parque de estacionamento"></div><div class="exit" aria-hidden="true">▶</div></div>
    <div class="acts"><button class="btn ghost" type="button" id="undoBtn">↶ Desfazer</button><button class="btn ghost" type="button" id="resetBtn">⟲ Recomeçar</button><button class="btn" type="button" id="hintBtn">💡 Ajuda</button></div>
    <p class="foot">Os carros só andam na direção em que estão virados.</p>
  </section>
</div>
<div class="ov" id="ov" hidden></div>
<div class="toast" id="toast" hidden></div>

/* ================= ENGARRAFADO: solucionador =================
   Tabuleiro 6×6 em texto de 36 letras: "o" vazio, "A" o carro vermelho (linha 3, sai pela direita), outras letras = carros/camiões.
   Uma jogada = deslizar um carro qualquer número de casas. bfs() devolve o caminho mais curto. */
const PK=(()=>{
const N=6,ROW=2;
function parse(b){const pcs={};for(let i=0;i<36;i++){const c=b[i];if(c==="o"||c===".")continue;const r=Math.floor(i/N),col=i%N;if(!pcs[c])pcs[c]={id:c,r,c:col,len:0,h:false};const p=pcs[c];p.len++;if(r===p.r&&col!==p.c)p.h=true}
  const list=Object.values(pcs).map(p=>{if(p.len>1&&!p.h){/* vertical */}return p});
  list.sort((a,b)=>a.id==="A"?-1:b.id==="A"?1:a.id<b.id?-1:1);return list}
/* estado = posição ao longo do eixo de cada peça */
const posOf=p=>p.h?p.c:p.r;
function occ(pcs,pos){const g=new Uint8Array(36);pcs.forEach((p,k)=>{for(let j=0;j<p.len;j++){const r=p.h?p.r:pos[k]+j,c=p.h?pos[k]+j:p.c;g[r*N+c]=k+1}});return g}
function moves(pcs,pos){const g=occ(pcs,pos),out=[];
  pcs.forEach((p,k)=>{const a=pos[k];
    for(let d=1;a-d>=0;d++){const r=p.h?p.r:a-d,c=p.h?a-d:p.c;if(g[r*N+c])break;out.push([k,a-d])}
    for(let d=1;a+p.len-1+d<N;d++){const r=p.h?p.r:a+p.len-1+d,c=p.h?a+p.len-1+d:p.c;if(g[r*N+c])break;out.push([k,a+d])}});
  return out}
const solved=(pcs,pos)=>pos[0]===N-pcs[0].len;
function bfs(pcs,start,limit=200000){
  const key=p=>String.fromCharCode(...p);const k0=key(start);if(solved(pcs,start))return[];
  const prev=new Map([[k0,null]]);let q=[start];
  while(q.length){const nq=[];for(const s of q){for(const [k,v] of moves(pcs,s)){const n=s.slice();n[k]=v;const kk=key(n);if(prev.has(kk))continue;prev.set(kk,[key(s),k,v]);
        if(solved(pcs,n)){const path=[];let cur=kk;while(prev.get(cur)){const [pk,pi,pv]=prev.get(cur);path.unshift([pi,pv]);cur=pk}return path}
        nq.push(n)}if(prev.size>limit)return null}q=nq}
  return null}
const startPos=pcs=>pcs.map(posOf);
return{N,ROW,parse,bfs,moves,occ,startPos,solved,posOf};
})();
if(typeof module!=="undefined")module.exports=PK;

/* ================= ENGARRAFADO (puzzle de estacionamento, offline) =================
   Arrasta os carros na direção em que estão virados para o carro vermelho sair pela direita.
   Níveis gerados com o mínimo de jogadas conhecido (PK.bfs); a ajuda calcula a melhor jogada a partir de onde estás. */
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const DIFF=[["f","Fácil","#7fd16b"],["m","Médio","#ffd23f"],["d","Difícil","#ff9f1c"],["e","Muito difícil","#e0483e"]];
const PROG=(()=>{try{return JSON.parse(store.get("park-prog")||"{}")}catch(e){return{}}})();
const saveProg=()=>store.set("park-prog",JSON.stringify(PROG));
const COLORS=["#2a62c4","#4f9f2f","#ff9f1c","#8a5cd6","#1f8a7d","#d23a6e","#f2c94c","#38b6e8","#8a5a2b","#7fd16b","#ff8ec0","#c0c8d2","#5a6470"];
let L=null; /* nível: {diff,i,b,min,pcs,pos,moves,hist,hints,done} */
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const hashStr=s=>{let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
function dailyLevel(){const pool=[...LEVELS.m.map((x,i)=>["m",i]),...LEVELS.d.map((x,i)=>["d",i])];return pool[hashStr("park"+today())%pool.length]}
/* ---------- menu ---------- */
function menu(){
  show("menu");const t=today(),dd=PROG["daily:"+t];
  $("dailyBtn").innerHTML=`<b>🚗 Puzzle do dia</b><small>${dd?"Resolvido "+"★".repeat(dd)+"☆".repeat(3-dd):"Igual para toda a gente hoje"}</small>`;
  $("levels").innerHTML=DIFF.map(([k,name,col])=>{const n=LEVELS[k].length;let open=0;for(let i=0;i<n;i++){if(PROG[k+i])open=i+1}const unlocked=Math.min(n,open+3);
    const stars=LEVELS[k].reduce((s,_,i)=>s+(PROG[k+i]||0),0);
    return`<div class="dsec"><div class="dh"><b style="--c:${col}">${name}</b><span>★ ${stars}/${n*3}</span></div><div class="grid">${LEVELS[k].map((_,i)=>{const st=PROG[k+i]||0,lock=i>=unlocked;return`<button type="button" class="lv ${st?"ok":""} ${lock?"lock":""}" data-d="${k}" data-i="${i}" ${lock?"disabled":""} style="--c:${col}"><span>${i+1}</span><small>${lock?"🔒":st?"★".repeat(st):""}</small></button>`}).join("")}</div></div>`}).join("");
}
$("levels").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b||b.disabled)return;unlock();start(b.dataset.d,+b.dataset.i,false)});
$("dailyBtn").onclick=()=>{unlock();const [d,i]=dailyLevel();start(d,i,true)};
function show(s){$("menuScr").hidden=s!=="menu";$("playScr").hidden=s!=="play"}
/* ---------- jogar ---------- */
function start(diff,i,daily){
  const [b,m]=LEVELS[diff][i].split(":");const pcs=PK.parse(b);
  L={diff,i,b,min:+m,pcs,pos:PK.startPos(pcs),moves:0,hist:[],hints:0,done:false,daily};
  show("play");build();render();
}
let cell=50;
function build(){
  const bd=$("board");bd.querySelectorAll(".car").forEach(e=>e.remove());
  L.pcs.forEach((p,k)=>{const el=document.createElement("div");el.className="car "+(k===0?"red":"")+(p.len===3?" truck":"")+(p.h?" h":" v");el.dataset.k=k;
    el.style.setProperty("--cc",k===0?"#e0483e":COLORS[(k-1)%COLORS.length]);
    el.innerHTML=`<i class="win1"></i><i class="win2"></i>${k===0?'<b>★</b>':""}`;bd.appendChild(el)});
  layout();
}
function layout(){const bd=$("board");cell=bd.clientWidth/6;L&&L.pcs.forEach((p,k)=>{const el=bd.querySelector(`.car[data-k="${k}"]`);if(!el)return;el.style.width=(p.h?p.len:1)*cell+"px";el.style.height=(p.h?1:p.len)*cell+"px";place(k)})}
function place(k,off=0){const p=L.pcs[k],el=$("board").querySelector(`.car[data-k="${k}"]`);const a=L.pos[k]*cell+off;el.style.transform=p.h?`translate(${a}px,${p.r*cell}px)`:`translate(${p.c*cell}px,${a}px)`}
function render(){
  const dn=DIFF.find(d=>d[0]===L.diff);
  $("lvName").textContent=L.daily?"Puzzle do dia":`${dn[1]} · ${L.i+1}`;
  $("mv").textContent=L.moves;$("minv").textContent=L.min;
  $("undoBtn").disabled=!L.hist.length||L.done;
  L.pcs.forEach((_,k)=>place(k));
}
/* limites de deslize de uma peça */
function range(k){const p=L.pcs[k],g=PK.occ(L.pcs,L.pos),a=L.pos[k];let lo=a,hi=a;
  while(lo-1>=0){const r=p.h?p.r:lo-1,c=p.h?lo-1:p.c;if(g[r*6+c])break;lo--}
  while(hi+p.len<6){const r=p.h?p.r:hi+p.len,c=p.h?hi+p.len:p.c;if(g[r*6+c])break;hi++}
  return[lo,hi]}
let drag=null;
$("board").addEventListener("pointerdown",e=>{const el=e.target.closest(".car");if(!el||!L||L.done)return;e.preventDefault();unlock();
  const k=+el.dataset.k,p=L.pcs[k],[lo,hi]=range(k);drag={k,el,x:e.clientX,y:e.clientY,lo,hi,a:L.pos[k],h:p.h};el.classList.add("drag");try{el.setPointerCapture(e.pointerId)}catch(x){}});
$("board").addEventListener("pointermove",e=>{if(!drag)return;const d=drag.h?e.clientX-drag.x:e.clientY-drag.y;
  const min=(drag.lo-drag.a)*cell,max=(drag.hi-drag.a)*cell;place(drag.k,Math.max(min,Math.min(max,d)))});
const endDrag=e=>{if(!drag)return;const d=drag.h?e.clientX-drag.x:e.clientY-drag.y;
  let np=Math.round(drag.a+d/cell);np=Math.max(drag.lo,Math.min(drag.hi,np));drag.el.classList.remove("drag");
  const k=drag.k;drag=null;if(np!==L.pos[k])doMove(k,np);else place(k)};
$("board").addEventListener("pointerup",endDrag);$("board").addEventListener("pointercancel",endDrag);
function doMove(k,np){L.hist.push(L.pos.slice());L.pos[k]=np;L.moves++;sfx("move");buzz(8);render();
  if(PK.solved(L.pcs,L.pos))win()}
$("undoBtn").onclick=()=>{if(!L||!L.hist.length||L.done)return;L.pos=L.hist.pop();L.moves=Math.max(0,L.moves-1);render();sfx("undo")};
$("resetBtn").onclick=()=>{if(!L)return;L.pos=PK.startPos(L.pcs);L.moves=0;L.hist=[];L.done=false;render();sfx("undo")};
$("hintBtn").onclick=()=>{if(!L||L.done)return;const path=PK.bfs(L.pcs,L.pos);if(!path||!path.length)return;const [k,v]=path[0];L.hints++;
  const el=$("board").querySelector(`.car[data-k="${k}"]`);el.classList.add("hint");setTimeout(()=>{el.classList.remove("hint");doMove(k,v)},500);
  toast(`Ajuda: faltam ${path.length} jogada${path.length===1?"":"s"} a partir daqui.`)};
$("backBtn").onclick=()=>menu();
function stars(){if(L.hints)return Math.min(2,L.moves<=L.min?2:1);return L.moves<=L.min?3:L.moves<=Math.ceil(L.min*1.5)?2:1}
function win(){
  L.done=true;const st=stars();const key=L.daily?"daily:"+today():L.diff+L.i;PROG[key]=Math.max(PROG[key]||0,st);if(L.daily)PROG[L.diff+L.i]=Math.max(PROG[L.diff+L.i]||0,st);saveProg();
  /* o carro vermelho sai pela direita */
  const el=$("board").querySelector('.car[data-k="0"]');el.style.transition="transform .6s cubic-bezier(.5,0,.8,.4)";el.style.transform=`translate(${7*cell}px,${L.pcs[0].r*cell}px)`;
  sfx("win");buzz([40,40,120]);
  const next=!L.daily&&LEVELS[L.diff][L.i+1]?`<button class="btn" type="button" data-a="next">Próximo nível ▶</button>`:"";
  setTimeout(()=>{el.style.transition="";showOv(`<div class="panel"><div class="eyebrow">${L.daily?"Puzzle do dia":"Nível "+(L.i+1)}</div><h2>Saiu!</h2><div class="stars">${"★".repeat(st)}<span>${"★".repeat(3-st)}</span></div>
    <p>${L.moves} jogada${L.moves===1?"":"s"} · mínimo possível: ${L.min}${L.hints?` · ${L.hints} ajuda${L.hints>1?"s":""}`:""}</p>${st<3&&!L.hints?`<p class="small">Consegues em ${L.min}? Tenta outra vez para as 3 estrelas.</p>`:""}
    ${next}<button class="btn ghost" type="button" data-a="again">Repetir</button><button class="btn ghost" type="button" data-a="menu">Níveis</button></div>`)},650);
}
const ov=$("ov");function showOv(h){ov.innerHTML=h;ov.hidden=false}
ov.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;ov.hidden=true;const a=b.dataset.a;
  if(a==="next")start(L.diff,L.i+1,false);else if(a==="again")start(L.diff,L.i,L.daily);else menu()});
let tt=0;function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2400)}
$("rulesBtn").onclick=()=>showOv(`<div class="panel rules"><h2>Como se joga</h2><ol><li>Tira o <b>carro vermelho</b> do parque pela saída à direita.</li><li>Arrasta os carros e camiões com o dedo. Só andam <b>para a frente e para trás</b>, na direção em que estão virados.</li><li>Cada deslize conta uma jogada, seja de uma casa ou de várias.</li><li>Resolve no <b>mínimo de jogadas</b> para ganhar 3 estrelas. A ajuda mostra a melhor jogada, mas aí o máximo são 2 estrelas.</li></ol><button class="btn" type="button" data-a="menu">Percebi</button></div>`);
/* ---------- som ---------- */
let AC=null,muted=store.get("pp-mute")==="1";
function unlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume()}catch(e){}}
function tone(f,d,o={}){if(muted||!AC||AC.state!=="running")return;const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain();os.type=o.type||"triangle";os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);g.gain.setValueAtTime(o.v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g).connect(AC.destination);os.start(t);os.stop(t+d+.02)}
const SFX={move:()=>tone(220,.08,{type:"square",v:.03,f2:180}),undo:()=>tone(330,.07,{f2:250}),win:()=>{tone(300,.5,{type:"sawtooth",v:.05,f2:900});[523,659,784,1047].forEach((f,i)=>tone(f,.15,{at:.5+i*.1,type:"square",v:.04}))}};
const sfx=k=>{try{SFX[k]()}catch(e){}};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function setMute(m){muted=m;store.set("pp-mute",m?"1":"0");$("mute").textContent=m?"🔇":"🔊";$("mute").setAttribute("aria-pressed",String(!m))}
function setTheme(t,sv){if(t==="light")document.documentElement.dataset.ppTheme="light";else delete document.documentElement.dataset.ppTheme;if(sv)store.set("pp-tema",t);const tb=$("themeBtn");tb.textContent=t==="light"?"☾":"☀";tb.title=t==="light"?"Tema escuro":"Tema claro"}
$("mute").addEventListener("click",()=>{setMute(!muted);unlock()});
$("themeBtn").addEventListener("click",()=>setTheme(document.documentElement.dataset.ppTheme==="light"?"dark":"light",true));
setTheme(document.documentElement.dataset.ppTheme==="light"?"light":"dark");setMute(muted);
window.addEventListener("resize",()=>{if(L)layout()});
menu();

</script>
<script>/* ===== Ecrã completo (menu e todos os jogos) =====
   O navegador sai do ecrã completo sempre que muda de página. Para não sair ao andar entre jogos,
   quando se está em ecrã completo os links do site abrem por cima, numa moldura (iframe) que ocupa o ecrã todo:
   a página de fora nunca muda e o ecrã completo mantém-se. O endereço e o botão "voltar" continuam a funcionar.
   A escolha fica guardada; se mesmo assim se mudar de página, volta a entrar no primeiro toque. */
(function(){
  const TOP=(()=>{try{return window.top!==window&&window.top.JFS&&window.top.JFS.shell?window.top:null}catch(e){return null}})();
  const D=TOP?TOP.document:document,de=D.documentElement;
  const can=!!(D.fullscreenEnabled||D.webkitFullscreenEnabled);
  const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
  const get=()=>{try{return localStorage.getItem("pp-fs")==="1"}catch(e){return false}};
  const set=v=>{try{localStorage.setItem("pp-fs",v?"1":"0")}catch(e){}};
  const enter=()=>{try{const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)return p.catch(()=>{});return Promise.resolve()}catch(e){return Promise.resolve()}};
  const leave=()=>{try{if(!isFs())return;const p=(D.exitFullscreen||D.webkitExitFullscreen).call(D);if(p&&p.catch)p.catch(()=>{})}catch(e){}};
  const JFS={can,isFs,wanted:get,enter,leave,framed:!!TOP};
  window.JFS=JFS;
  /* rodar o ecrã: dentro da moldura tem de ser a página de fora a pedir */
  JFS.lockOr=o=>{const sc=(TOP||window).screen;return sc.orientation&&sc.orientation.lock?sc.orientation.lock(o):Promise.reject()};
  JFS.unlockOr=()=>{try{const sc=(TOP||window).screen;sc.orientation&&sc.orientation.unlock&&sc.orientation.unlock()}catch(e){}};
  /* ir para o menu (passa pela moldura se for caso disso) */
  JFS.home=()=>{const a=document.createElement("a");a.href=new URL("../",location.href).href;a.style.display="none";document.body.appendChild(a);a.click();a.remove()};

  /* ---- links do site ---- */
  const sameSite=a=>{
    if(!a||a.target&&a.target!=="_self"||a.hasAttribute("download"))return null;
    let u;try{u=new URL(a.href,location.href)}catch(e){return null}
    if(u.origin!==location.origin)return null;
    if(u.href.split("#")[0]===location.href.split("#")[0])return null; /* só muda o # */
    return u.href;
  };
  if(TOP){
    /* dentro da moldura: os links vão para a página de fora tratar */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();TOP.JFS.go(h)},false);
  }else{
    JFS.shell=true;
    const HOME=location.href.split("#")[0],baseTitle=document.title;let fr=null,bk=null,syncT=0;
    /* a zona da câmara e da barra de baixo fica com a mesma cor e padrão do jogo que está aberto */
    const meta=document.querySelector('meta[name="theme-color"]');
    const sync=()=>{try{const d=fr.contentDocument;if(!d||!d.body)return;const pl=d.getElementById("play");const el=pl&&!pl.hidden?pl:d.body;const cs=getComputedStyle(el);let bg=cs.backgroundColor;if(el===d.body&&(bg==="rgba(0, 0, 0, 0)"||bg==="transparent"))bg=getComputedStyle(d.documentElement).backgroundColor;
      bk.style.backgroundColor=bg;bk.style.backgroundImage=cs.backgroundImage;bk.style.backgroundSize=cs.backgroundSize;if(meta)meta.content=bg}catch(e){}};
    const close=()=>{if(!fr)return;clearInterval(syncT);fr.remove();fr=null;if(bk){bk.remove();bk=null}document.documentElement.style.overflow="";document.title=baseTitle};
    const show=href=>{
      if(href.split("#")[0]===HOME){close();return}
      if(!fr){
        fr=document.createElement("iframe");fr.id="jfsFrame";fr.title="Jogo";
        fr.allow="fullscreen; web-share; clipboard-write; accelerometer; gyroscope; autoplay; screen-wake-lock";fr.setAttribute("allowfullscreen","");
        /* dentro de uma moldura o env(safe-area-inset-*) vale 0, por isso é a moldura que fica fora da câmara e dos cantos */fr.style.cssText="position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg,#f4eee3)";bk=document.createElement("div");bk.style.cssText="position:fixed;inset:0;z-index:2147483000;background:var(--bg,#f4eee3)";document.body.appendChild(bk);
        fr.src=href;bk.appendChild(fr);document.documentElement.style.overflow="hidden";
        fr.addEventListener("load",()=>{try{document.title=fr.contentDocument.title}catch(e){}sync()});syncT=setInterval(sync,300);
      }else{try{fr.contentWindow.location.replace(href)}catch(e){fr.src=href}}
    };
    JFS.go=href=>{
      const st=history.state&&history.state.jf?history.state:null;
      if(href.split("#")[0]===HOME){if(st&&st.i>0)history.go(-st.i);else close();return}
      const i=(st?st.i:0)+1;
      history.pushState({jf:href,i},"",href);show(href);
    };
    addEventListener("popstate",e=>{const s=e.state;if(s&&s.jf)show(s.jf);else close()});
    if(history.state&&history.state.jf)history.replaceState(null,"",HOME);
    /* jogo aberto diretamente (atalho, link de convite): o botão "voltar" do telemóvel leva ao menu em vez de sair do site */
    if(!document.querySelector("nav.games")&&document.querySelector('a[href="../"]')){
      const HUB=new URL("../",location.href).href,ref=(document.referrer||"").split("#")[0];
      if(ref!==HUB&&!(history.state&&history.state.jg)){const here=location.href;try{history.replaceState({jhub:1},"",HUB);history.pushState({jg:1},"",here)}catch(e){}}
      addEventListener("popstate",e=>{if(e.state&&e.state.jhub)location.replace(HUB)});
    }
    /* em ecrã completo, os links do site abrem na moldura */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;if(!isFs()&&!fr&&!get())return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();JFS.go(h)},false);
  }
  if(!can)return;

  /* ---- botão ---- */
  const IN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  let btn=document.getElementById("fsBtn");
  if(btn){const c=btn.cloneNode(false);c.removeAttribute("aria-pressed");btn.replaceWith(c);btn=c} /* a Panela tinha o seu; passa a usar este */
  else{
    const tools=document.querySelector("header .tools");if(!tools)return;
    btn=document.createElement("button");btn.className="btn ghost sm ico";btn.id="fsBtn";btn.type="button";
    const tb=document.getElementById("themeBtn");tools.insertBefore(btn,tb||null);
  }
  const st=document.createElement("style");
  st.textContent="#fsBtn{display:inline-grid;place-items:center}#fsBtn[hidden]{display:none}#fsBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}";
  document.head.appendChild(st);
  const upd=()=>{const f=isFs();btn.innerHTML=f?OUT:IN;btn.title=f?"Sair do ecrã completo":"Ecrã completo";btn.setAttribute("aria-label",btn.title);if(window.dispatchEvent)setTimeout(()=>dispatchEvent(new Event("resize")),250)};
  upd();D.addEventListener("fullscreenchange",upd);D.addEventListener("webkitfullscreenchange",upd);
  btn.hidden=false;
  btn.addEventListener("click",()=>{const f=isFs();set(!f);f?leave():enter()});
  if(TOP)return;
  /* guardar a escolha */
  let leaving=false;addEventListener("pagehide",()=>{leaving=true});
  const onChange=()=>{if(!isFs()&&!leaving&&document.visibilityState==="visible")set(false)};
  document.addEventListener("fullscreenchange",onChange);document.addEventListener("webkitfullscreenchange",onChange);
  /* se mesmo assim mudou de página: volta a entrar no primeiro toque */
  if(get()&&!isFs()){
    const off=()=>{removeEventListener("click",once,true);removeEventListener("touchend",once,true)};
    const once=e=>{if(e.target&&e.target.closest&&e.target.closest("#fsBtn"))return;off();if(!isFs())enter()};
    addEventListener("click",once,true);addEventListener("touchend",once,true);
  }
})();
</script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}))</script></body>
