[hidden]{display:none!important}
:root{
  --bg:#000000; --surface:#1b2d2b; --surface-2:#223835; --line:#2f4744;
  --ink:#eef2ea; --muted:#9fb5af; --title:#f1ece2; --enamel:#f1ece2; --card-ink:#1b2422;

}
:root[data-pp-theme="light"]{
  --bg:#f4eee3; --surface:#fffaf1; --surface-2:#ebe1cf; --line:#d8cab2;
  --ink:#1f2a28; --muted:#5b6965; --title:#1f2a28; --enamel:#fffdf8; --card-ink:#1b2422;

html,body{margin:0}

.wrap{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--steam);outline-offset:2px}
a{color:inherit}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 20px;font-weight:800;font-size:15px;text-decoration:none;line-height:1.1}
.btn:disabled{opacity:.4;cursor:default}

.brand h1{font-size:clamp(24px,6vw,34px);line-height:1;color:var(--title)}

.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;box-sizing:border-box;min-width:0}
input:focus,input:focus-visible{outline:none;border-color:var(--steam);box-shadow:inset 0 0 0 1.5px var(--steam)}
.setup{display:flex;flex-direction:column;gap:16px;align-items:flex-start;flex:1;padding-block:12px 24px}
.setup h2{font-size:clamp(34px,10vw,60px);line-height:.95;color:var(--title)}
.setup h2 span{color:var(--accent);display:block}

.choices{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;width:100%;max-width:360px}

.join{display:flex;gap:8px}

.join.fromlink input{border-color:var(--accent)}

.mode.nopeer .choices,.mode.nopeer .join{display:none}
.lobby .code{font-size:clamp(44px,14vw,80px);letter-spacing:.12em;color:var(--accent)}

.roster .rn{font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.roster .rn em{font-style:normal;font-weight:600;color:var(--muted)}
.roster .rk{font-size:12px;color:var(--muted)}
.roster li.free .rn{font-weight:400}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.foot{font-size:13px;color:var(--muted);margin:4px 0 0}
.modal{position:fixed;inset:0;background:rgba(8,14,13,.72);display:grid;place-items:center;padding:16px;z-index:33;box-sizing:border-box}
.sheet{box-sizing:border-box;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px;max-width:460px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:24px;color:var(--title)}
.sheet .body{color:var(--muted)}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap}
.sheet ul{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px}
.sheet li b{color:var(--ink)}
.alert{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);width:max-content;box-sizing:border-box;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;padding:12px 16px;border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.3);text-align:center;pointer-events:none}
.alert.show{animation:alertin .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes alertin{from{transform:translate(-50%,-20px) scale(.9);opacity:0}to{transform:translateX(-50%);opacity:1}}
.bubble{position:fixed;transform:translate(-50%,-100%);font-size:30px;pointer-events:none;animation:bub 2.6s ease forwards;z-index:26}
@keyframes bub{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.1)}20%{transform:translate(-50%,-100%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%)}}
.reacts{position:fixed;z-index:35;display:grid;grid-template-columns:repeat(3,auto);gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.reacts button{font-size:24px;background:var(--surface-2);border:0;border-radius:10px;padding:4px 9px}
@media (prefers-reduced-motion:reduce){.alert.show,.bubble{animation:none}}
.roster li.free.more{border:0!important;background:transparent;padding:2px 6px;min-height:0;font-size:13px}

/* ===== Estilo banda desenhada (comum a todos os jogos) ===== */
@font-face{font-family:"Bangers";font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/bangers.woff2) format("woff2")}
:root{--display:"Bangers","Bowlby One",Impact,sans-serif;--stroke:#151515;--pop:#ffd23f;--pop-ink:#151515;
  --dots:radial-gradient(rgba(21,21,21,.09) 1.3px,transparent 1.6px)}
:root:not([data-pp-theme="light"]){--stroke:#050807;--dots:radial-gradient(rgba(255,255,255,.06) 1.3px,transparent 1.6px)}
body{background-image:var(--dots);background-size:13px 13px}
h1,h2,h3{font-family:var(--display);letter-spacing:.03em;font-weight:400}
.brand h1{font-size:clamp(30px,8vw,42px);-webkit-text-stroke:1.5px var(--stroke);text-shadow:3px 3px 0 var(--stroke);color:var(--title)}
.brand h1 span{color:var(--accent)}
.setup h2{font-size:clamp(40px,12vw,72px);line-height:.92;text-shadow:3px 3px 0 color-mix(in srgb,var(--stroke) 25%,transparent)}
.btn{border:3px solid var(--stroke)!important;box-shadow:3px 3px 0 var(--stroke);font-family:var(--display);font-size:19px;letter-spacing:.06em;font-weight:400;padding:9px 20px;transition:transform .08s,box-shadow .08s}
.btn.sm{font-size:15px;padding:4px 11px;box-shadow:2px 2px 0 var(--stroke)}
.btn.ico{font-family:var(--body)}
.btn:not(:disabled):active{transform:translate(3px,3px);box-shadow:0 0 0 var(--stroke)}
.btn.ghost{background:var(--surface)}
input{border:3px solid var(--stroke);box-shadow:3px 3px 0 var(--stroke)}
.mode,.roster li,.sheet,.qcard,.bcard,.wordcard,.mucard,.rstep,.board li,.opt,.sub,.wcard,.sent,.jbox,.yourturn,.outbox,.words p,.roles li,.others li,.tally li,.drink,.yn2 p,.rulebar,.vol li,.chips li,.seg button,.age,.foreheads li{border:3px solid var(--stroke)!important;box-shadow:4px 4px 0 var(--stroke)}
.roster li.free{box-shadow:none;border-style:dashed!important}
.chips li,.seg button,.vol li{box-shadow:2px 2px 0 var(--stroke)}

.opt:not(:disabled):active,.sub:not(:disabled):active,.wcard:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--stroke)}
.lobby .code{-webkit-text-stroke:2px var(--stroke);text-shadow:4px 4px 0 var(--stroke);letter-spacing:.14em}

.eyebrow{letter-spacing:.12em}

:root,:root[data-pp-theme="light"]{--accent:#1f7fd1;--accent-ink:#fff}

html,body{height:100%}
body{padding-bottom:max(8px,env(safe-area-inset-bottom,0px));overflow:hidden}
.wrap{max-width:520px;gap:8px;min-height:0;flex:1;display:flex;flex-direction:column}
header.top{flex:none}

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Voa <span>Voa</span></h1><a class="home" id="hubLink" href="../">← mais jogos</a></div>
    <div class="tools">
      <button class="btn ghost sm ico" id="mute" type="button" aria-pressed="true" aria-label="Som" title="Som">🔊</button>

</div>

": 1.3714285714285714}, "girafa": {"svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"  viewBox=\"20 4 165 140\" role=\"img\" aria-label=\"Girafa de óculos a ler um livro\">\n<g stroke=\"#151515\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<path d=\"M80 262 C84 200 88 158 92 118 L122 118 C126 158 132 200 138 262 Z\" fill=\"#f2b544\"/>\n<g stroke-width=\"3\" fill=\"#b8662b\"><path d=\"M97 150q9-7 15 1q-1 11-12 9q-7-3-3-10z\"/><path d=\"M114 182q9-5 13 3q-2 9-11 7q-6-4-2-10z\"/><path d=\"M93 200q8-5 13 2q-1 10-11 8q-6-3-2-10z\"/><path d=\"M110 228q9-5 14 3q-2 9-12 7q-6-4-2-10z\"/><path d=\"M98 128q6-4 10 1q-1 7-8 6q-4-3-2-7z\"/></g>\n<path d=\"M66 62q-34-14-40 2q16 18 44 10z\" fill=\"#f2b544\"/><path d=\"M58 62q-16-4-22 1\" fill=\"none\" stroke-width=\"3\"/>\n<path d=\"M142 62q34-14 40 2q-16 18-44 10z\" fill=\"#f2b544\"/><path d=\"M150 62q16-4 22 1\" fill=\"none\" stroke-width=\"3\"/>\n<path d=\"M88 46l-7-26\" stroke-width=\"8\"/><circle cx=\"80\" cy=\"17\" r=\"9\" fill=\"#7a3f1c\"/>\n<path d=\"M118 46l7-26\" stroke-width=\"8\"/><circle cx=\"126\" cy=\"17\" r=\"9\" fill=\"#7a3f1c\"/>\n<path d=\"M62 74C58 36 146 34 146 72C148 98 140 110 130 120L80 120C68 110 62 98 62 74Z\" fill=\"#f2b544\"/>\n<g stroke-width=\"3\" fill=\"#b8662b\"><path d=\"M70 92q6-5 10 1q-1 7-8 5q-4-2-2-6z\"/><path d=\"M128 50q7-4 10 2q-2 7-8 5q-4-3-2-7z\"/><path d=\"M80 48q6-3 9 2q-2 6-7 4q-4-2-2-6z\"/></g>\n<ellipse cx=\"104\" cy=\"116\" rx=\"35\" ry=\"23\" fill=\"#f7d9a3\"/>\n<circle cx=\"92\" cy=\"113\" r=\"3.5\" fill=\"#151515\" stroke-width=\"0\"/><circle cx=\"116\" cy=\"113\" r=\"3.5\" fill=\"#151515\" stroke-width=\"0\"/>\n<path d=\"M88 127q16 9 32 0\" fill=\"none\" stroke-width=\"4\"/>\n<circle cx=\"85\" cy=\"78\" r=\"16\" fill=\"#e8f4ff\" fill-opacity=\".55\"/><circle cx=\"123\" cy=\"78\" r=\"16\" fill=\"#e8f4ff\" fill-opacity=\".55\"/>\n<path d=\"M101 77q3-4 6 0\" fill=\"none\" stroke-width=\"4\"/><path d=\"M69 76l-8-3M139 76l8-3\" stroke-width=\"4\"/>\n<g class=\"gf-eyes\"><circle cx=\"87\" cy=\"82\" r=\"5.5\" fill=\"#151515\" stroke-width=\"0\"/><circle cx=\"121\" cy=\"82\" r=\"5.5\" fill=\"#151515\" stroke-width=\"0\"/>\n<circle cx=\"89\" cy=\"80\" r=\"1.6\" fill=\"#fff\" stroke-width=\"0\"/><circle cx=\"123\" cy=\"80\" r=\"1.6\" fill=\"#fff\" stroke-width=\"0\"/></g>\n<path d=\"M76 76q11-6 22 0M112 76q11-6 22 0\" fill=\"none\" stroke-width=\"4\"/>\n<path d=\"M77 74l-3-4M82 72l-1-4M126 72l1-4M131 74l3-4\" stroke-width=\"2.5\"/>\n<path d=\"M30 230l74-16l74 16l0 34l-74-14l-74 14z\" fill=\"#b8352c\"/>\n<path d=\"M36 226l68-12l0 34l-68 12z\" fill=\"#fffdf8\"/><path d=\"M172 226l-68-12l0 34l68 12z\" fill=\"#fffdf8\"/>\n<path d=\"M46 232l46-8M46 242l46-8M116 224l46 8M116 234l46 8\" stroke-width=\"2.5\" stroke=\"#8a8a8a\"/>\n<g class=\"gf-page\" opacity=\"0\"><path d=\"M172 222l-68-8l0 34l68 8z\" fill=\"#f3e7cb\"/><path d=\"M116 224l46 8M116 234l46 8\" stroke-width=\"2.5\" stroke=\"#8a8a8a\"/></g>\n</g></svg>", "ar": 1.1785714285714286}};
/* ================= VOA VOA =================
   Toca para voar e passa entre os pilares de azulejo. Física a passo fixo (igual em ecrãs de 60 ou 120 Hz).
   SPR (posto pelo build): {macaco:{svg,ar}, girafa:{svg,ar}} com as cabeças das personagens. */
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage"),ov=$("ov"),hint=$("hint");
const FAST=()=>window.__fast?1:1;
/* mundo em unidades: largura fixa 320 */
const WW=320,GROUND=58;
const PH={grav:1350,flap:-390,maxFall:600,speed:128,gap:138,minGap:112,pw:60,spacing:190,r:15};
let WH=560,scale=1,dpr=1;
let who=store.get("voa-boneco")==="girafa"?"girafa":"macaco";
let best=+store.get("voa-recorde")||0;
let state="pick"; /* pick | ready | play | dead | over */
let P,pipes,score,tScroll,flash,deadT,newRec=false;

/* ---------- imagens ---------- */
const IMG={};
for(const k in SPR){const im=new Image();im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(SPR[k].svg);IMG[k]=im}
/* padrão de azulejo (pré-desenhado) */
function tilePattern(){
  const s=24,c=document.createElement("canvas");c.width=c.height=s*2;const g=c.getContext("2d");
  g.fillStyle="#f7fbff";g.fillRect(0,0,s*2,s*2);g.strokeStyle="#1f4fa0";g.fillStyle="#2a62c4";g.lineWidth=2;
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){const x=i*s,y=j*s;g.strokeRect(x+.5,y+.5,s-1,s-1);
    g.beginPath();g.moveTo(x+s/2,y+3);g.lineTo(x+s-3,y+s/2);g.lineTo(x+s/2,y+s-3);g.lineTo(x+3,y+s/2);g.closePath();g.fill();
    g.fillStyle="#f7fbff";g.beginPath();g.arc(x+s/2,y+s/2,3.2,0,7);g.fill();g.fillStyle="#2a62c4";
    g.beginPath();g.arc(x,y,4,0,7);g.arc(x+s,y,4,0,7);g.fill()}
  return c;
}
let TILE=null,TILEP=null;
function calcadaPattern(){
  const c=document.createElement("canvas");c.width=40;c.height=20;const g=c.getContext("2d");
  g.fillStyle="#efe7d6";g.fillRect(0,0,40,20);g.strokeStyle="#151515";g.lineWidth=2;
  g.beginPath();g.moveTo(0,20);for(let x=0;x<=40;x+=10)g.quadraticCurveTo(x+5,x%20?2:18,x+10,20);g.stroke();
  g.fillStyle="#3b3b3b";g.beginPath();g.moveTo(0,10);for(let x=0;x<=40;x+=20){g.quadraticCurveTo(x+10,0,x+20,10)}g.lineTo(40,14);for(let x=40;x>=0;x-=20){g.quadraticCurveTo(x-10,4,x-20,14)}g.fill();
  return c;
}
let CALC=null,CALCP=null;

/* ---------- som ---------- */
let AC=null,muted=store.get("pp-mute")==="1";
function unlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume()}catch(e){}}
function tone(f,d,o={}){if(muted||!AC||AC.state!=="running")return;const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain();os.type=o.type||"triangle";os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);g.gain.setValueAtTime(o.v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g).connect(AC.destination);os.start(t);os.stop(t+d+.02)}
const SFX={flap:()=>tone(420,.09,{f2:760,v:.05}),point:()=>{tone(988,.07,{type:"square",v:.04});tone(1319,.12,{type:"square",v:.04,at:.07})},hit:()=>tone(160,.25,{type:"sawtooth",f2:60,v:.12}),fall:()=>tone(600,.5,{f2:120,v:.06}),rec:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.15,{at:i*.09,type:"square",v:.04}))};
const sfx=k=>{try{SFX[k]()}catch(e){}};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function setMute(m){muted=m;store.set("pp-mute",m?"1":"0");$("mute").textContent=m?"🔇":"🔊";$("mute").setAttribute("aria-pressed",String(!m))}
function setTheme(t,save){if(t==="light")document.documentElement.dataset.ppTheme="light";else delete document.documentElement.dataset.ppTheme;if(save)store.set("pp-tema",t);const tb=$("themeBtn");tb.textContent=t==="light"?"☾":"☀";tb.title=t==="light"?"Tema escuro":"Tema claro"}
let WL=null;
async function keepAwake(on){try{if(on&&!WL&&navigator.wakeLock&&!document.hidden){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}else if(!on&&WL){const w=WL;WL=null;await w.release()}}catch(e){}}

/* ---------- tamanho ---------- */
function layout(){
  const r=stage.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  scale=cv.width/WW;WH=Math.max(420,cv.height/scale);
  if(!TILE){TILE=tilePattern();CALC=calcadaPattern()}
  TILEP=ctx.createPattern(TILE,"repeat");CALCP=ctx.createPattern(CALC,"repeat");
  prerender();
  if(state!=="play"&&P)P.y=Math.min(P.y,WH-GROUND-40);
}

/* ---------- jogo ---------- */
function reset(){
  P={x:WW*.3,y:(WH-GROUND)*.45,vy:0,rot:0,bob:0,prop:0};
  pipes=[];score=0;tScroll=0;flash=0;deadT=0;newRec=false;
  for(let i=0;i<3;i++)addPipe(WW+80+i*PH.spacing);
}
function gapNow(){return Math.max(PH.minGap,PH.gap-score*1.1)}
function addPipe(x){
  const g=gapNow(),top=70,bot=WH-GROUND-70-g;
  const last=pipes.length?pipes[pipes.length-1].gy:(WH-GROUND)/2-g/2;
  let gy=top+Math.random()*Math.max(10,bot-top);
  gy=Math.max(last-170,Math.min(last+170,gy)); /* sem saltos impossíveis */
  pipes.push({x,gy,g,passed:false});
}
const speedNow=()=>Math.min(185,PH.speed+score*1.6);
function flap(){
  unlock();
  if(state==="ready"){state="play";hint.hidden=true;keepAwake(true)}
  if(state!=="play")return;
  P.vy=PH.flap;sfx("flap");
}
function die(){
  if(state!=="play")return;
  state="dead";flash=1;sfx("hit");buzz([40,30,80]);keepAwake(false);
  setTimeout(()=>sfx("fall"),180);
  if(P.vy<0)P.vy=0;
}
function update(dt){
  P.prop+=dt*(state==="play"?28:12);
  if(state==="ready"||state==="pick"){P.bob+=dt*3;P.y=(WH-GROUND)*.45+Math.sin(P.bob)*8;tScroll+=dt*PH.speed*.6;return}
  if(state==="over"||state==="pause")return;
  /* física */
  P.vy=Math.min(PH.maxFall,P.vy+PH.grav*dt);P.y+=P.vy*dt;
  const target=Math.max(-.45,Math.min(1.35,P.vy/520));P.rot+=(target-P.rot)*Math.min(1,dt*10);
  if(flash>0)flash=Math.max(0,flash-dt*3);
  const floor=WH-GROUND-PH.r;
  if(state==="dead"){
    if(P.y>=floor){P.y=floor;P.vy=0;deadT+=dt;if(deadT>.45)gameOver()}
    return;
  }
  const v=speedNow();tScroll+=dt*v;
  for(const p of pipes){p.x-=v*dt;
    if(!p.passed&&p.x+PH.pw<P.x){p.passed=true;score++;sfx("point");if(score%10===0)buzz(25)}}
  if(pipes.length&&pipes[0].x<-PH.pw-10)pipes.shift();
  const last=pipes[pipes.length-1];if(last.x<WW+40)addPipe(last.x+PH.spacing);
  /* colisões: círculo contra retângulos */
  if(P.y>=floor){P.y=floor;die();return}
  if(P.y<-30){P.y=-30;P.vy=0}
  const r=PH.r;
  for(const p of pipes){
    if(P.x+r<p.x||P.x-r>p.x+PH.pw)continue;
    const cx=Math.max(p.x,Math.min(P.x,p.x+PH.pw));
    for(const [y0,y1] of [[-100,p.gy],[p.gy+p.g,WH]]){const cy=Math.max(y0,Math.min(P.y,y1));const dx=P.x-cx,dy=P.y-cy;if(dx*dx+dy*dy<r*r*.92){die();return}}
  }
}
const MEDALS=[[100,4,"💎"],[50,3,"🥇"],[25,2,"🥈"],[10,1,"🥉"]];
function gameOver(){
  state="over";
  if(score>best){best=score;store.set("voa-recorde",String(best));newRec=score>0;if(newRec)sfx("rec")}
  const m=MEDALS.find(x=>score>=x[0]);
  ov.innerHTML=`<div class="panel"><h2>Caíste!</h2>
    <div class="stats"><div><span>Pontos</span><b>${score}</b></div><div><span>Recorde</span><b>${best}</b></div></div>
    ${newRec?'<div class="newrec">★ Novo recorde! ★</div>':""}
    <div class="medal m${m?m[1]:0}">${m?m[2]:""}</div>
    <p>${m?["","Medalha de bronze!","Medalha de prata!","Medalha de ouro!","Platina! És uma lenda."][m[1]]:`Passa ${10-score>0?10-score:0} pilares para a primeira medalha.`}</p>
    <button class="btn" type="button" data-a="again">Outra vez</button><button class="btn ghost sm" type="button" data-a="pick">Mudar de boneco</button></div>`;
  ov.hidden=false;
}

/* ---------- desenho ----------
   Tudo o que não muda (céu, nuvem, casas, boneco) é desenhado uma vez numa tela à parte
   e depois só se copia; assim o jogo corre liso mesmo em telemóveis fracos. */
const HERO_H=44;
let SKY=null,CLOUD=null,HOUSES=null,HW=0,HERO={};
function off(w,h){const c=document.createElement("canvas");c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
function prerender(){
  const s=scale;
  /* céu */
  SKY=off(WW*s,WH*s);let g=SKY.getContext("2d");const gr=g.createLinearGradient(0,0,0,SKY.height);gr.addColorStop(0,"#6ec6ff");gr.addColorStop(1,"#d9f3ff");g.fillStyle=gr;g.fillRect(0,0,SKY.width,SKY.height);
  /* nuvem */
  CLOUD=off(64*s,40*s);g=CLOUD.getContext("2d");g.scale(s,s);g.fillStyle="#fff";g.strokeStyle="#151515";g.lineWidth=2.5;
  g.beginPath();g.arc(17,24,14,Math.PI*.5,Math.PI*1.5);g.arc(33,16,16,Math.PI,Math.PI*2);g.arc(49,24,13,Math.PI*1.5,Math.PI*.5);g.closePath();g.fill();g.stroke();
  /* fila de casas (repete-se) */
  const w=46,n=9;HW=w*n;HOUSES=off(HW*s,90*s);g=HOUSES.getContext("2d");g.scale(s,s);g.strokeStyle="#151515";g.lineWidth=2.5;
  for(let i=0;i<n;i++){const x=i*w,h=36+((i*29)%5)*9,b=90;
    g.fillStyle=i%3?"#f6e3c4":"#f9d9a6";g.fillRect(x,b-h,w,h);g.strokeRect(x,b-h,w,h);
    g.fillStyle="#d8572a";g.beginPath();g.moveTo(x-2,b-h);g.lineTo(x+w/2,b-h-16);g.lineTo(x+w+2,b-h);g.closePath();g.fill();g.stroke();
    g.fillStyle="#3a6fb5";g.fillRect(x+9,b-h+10,8,10);g.fillRect(x+w-17,b-h+10,8,10)}
  heroPrerender();
}
function heroPrerender(){
  for(const k in IMG){const im=IMG[k];if(!(im.complete&&im.naturalWidth))continue;
    const ar=SPR[k].ar,h=HERO_H,w=h*ar,c=off(w*scale,h*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);HERO[k]={c,w,h}}
}
for(const k in IMG)IMG[k].addEventListener("load",()=>{if(scale)heroPrerender()});
function blit(img,x,y,w,h){ctx.drawImage(img,Math.round(x*scale),Math.round(y*scale),Math.round(w*scale),Math.round(h*scale))}
function draw(){
  const s=scale;
  ctx.setTransform(1,0,0,1,0,0);
  if(SKY)ctx.drawImage(SKY,0,0);
  for(let i=0;i<4;i++){const x=((i*140-tScroll*.15)%(WW+180)+WW+180)%(WW+180)-90,y=40+i*37%110;blit(CLOUD,x,y-24,64,40)}
  const base=WH-GROUND,hx=-((tScroll*.4)%HW);
  blit(HOUSES,hx,base-90,HW,90);blit(HOUSES,hx+HW,base-90,HW,90);
  ctx.setTransform(s,0,0,s,0,0);
  /* pilares de azulejo */
  ctx.lineWidth=3;ctx.strokeStyle="#151515";
  for(const p of pipes){
    for(const [y,h,cap] of [[-4,p.gy+4,p.gy-16],[p.gy+p.g,WH-GROUND-p.gy-p.g,p.gy+p.g]]){
      ctx.save();ctx.translate(p.x,0);ctx.fillStyle=TILEP;ctx.fillRect(0,y,PH.pw,h);ctx.restore();
      ctx.strokeRect(p.x,y,PH.pw,h);
      ctx.fillStyle="#f2c94c";ctx.fillRect(p.x-5,cap,PH.pw+10,16);ctx.strokeRect(p.x-5,cap,PH.pw+10,16);
    }
  }
  /* chão: calçada portuguesa */
  ctx.save();ctx.translate(-(tScroll%40),0);ctx.fillStyle=CALCP;ctx.fillRect(0,base,WW+40,GROUND);ctx.restore();
  ctx.fillStyle="#151515";ctx.fillRect(0,base-2,WW,4);
  drawHero();
  if(state==="play"||state==="dead"||state==="pause"){
    ctx.font="400 54px Bangers, Impact, sans-serif";ctx.textAlign="center";ctx.textBaseline="top";ctx.lineJoin="round";
    ctx.lineWidth=8;ctx.strokeStyle="#151515";ctx.strokeText(String(score),WW/2,22);ctx.fillStyle="#fff";ctx.fillText(String(score),WW/2,22);
  }
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.8})`;ctx.fillRect(0,0,WW,WH)}
}
function drawHero(){
  const H=HERO[who],h=HERO_H,w=H?H.w:h;
  ctx.save();ctx.translate(P.x,P.y);ctx.rotate(state==="ready"||state==="pick"?0:P.rot*.8);
  /* chapéu de hélice */
  const top=-h*.5-(who==="girafa"?3:-2);
  ctx.lineWidth=2.2;ctx.strokeStyle="#151515";
  ctx.fillStyle="#d23a6e";ctx.beginPath();ctx.ellipse(0,top+5,12,7,0,Math.PI,0);ctx.fill();ctx.stroke();
  ctx.fillStyle="#ffd23f";ctx.fillRect(-1.5,top-5,3,7);ctx.strokeRect(-1.5,top-5,3,7);
  const pw=Math.abs(Math.cos(P.prop))*14+2;ctx.fillStyle="#1f7fd1";ctx.beginPath();ctx.ellipse(0,top-6,pw,2.6,0,0,7);ctx.fill();ctx.stroke();
  if(H)ctx.drawImage(H.c,-w/2,-h/2,w,h);
  else{ctx.fillStyle=who==="girafa"?"#f2b544":"#6b3f22";ctx.beginPath();ctx.arc(0,0,PH.r,0,7);ctx.fill();ctx.stroke()}
  ctx.restore();
}

/* ---------- ciclo (passo fixo) ---------- */
let last=performance.now();const STEP=1/120;
function loop(t){
  /* passo variável dividido em bocados pequenos: movimento liso a 60, 90, 120 ou 144 Hz */
  const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
  const n=Math.max(1,Math.ceil(dt/STEP));for(let i=0;i<n;i++)update(dt/n);
  draw();requestAnimationFrame(loop);
}

/* ---------- ecrãs ---------- */
function pickScreen(){
  state="pick";hint.hidden=true;reset();keepAwake(false);
  const card=k=>`<button type="button" data-who="${k}" class="${who===k?"on":""}">${SPR[k].svg.replace("<svg ",'<svg aria-hidden="true" ')}${k==="macaco"?"Macaco":"Girafa"}<small>${k==="macaco"?"Imperial na mão":"Óculos e livro"}</small></button>`;
  ov.innerHTML=`<div class="panel"><h2>Voa Voa!</h2><p>Escolhe quem vai voar</p><div class="pick">${card("macaco")}${card("girafa")}</div>
    <button class="btn" type="button" data-a="go">Jogar</button><p>Recorde: ${best}</p></div>`;
  ov.hidden=false;
}
function ready(){state="ready";ov.hidden=true;reset();hint.hidden=false}
ov.addEventListener("click",e=>{
  const p=e.target.closest("[data-who]");
  if(p){who=p.dataset.who;store.set("voa-boneco",who);ov.querySelectorAll("[data-who]").forEach(b=>b.classList.toggle("on",b===p));tone(880,.05,{v:.04});return}
  const b=e.target.closest("[data-a]");if(!b)return;unlock();
  if(b.dataset.a==="go"||b.dataset.a==="again")ready();
  else if(b.dataset.a==="pick")pickScreen();
  else if(b.dataset.a==="resume"){ov.hidden=true;state="play";P.vy=PH.flap*.6;keepAwake(true)}
});
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".ov:not([hidden])"))return;e.preventDefault();flap()});
document.addEventListener("keydown",e=>{
  if(e.repeat)return;
  if(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W"){e.preventDefault();if(state==="over")ready();else if(state==="pick")ready();else flap()}
  if(e.key==="Enter"&&(state==="over"||state==="pick")){e.preventDefault();ready()}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play"){state="pause";keepAwake(false);
  ov.innerHTML=`<div class="panel"><h2>Pausa</h2><p>Pontos: ${score}</p><button class="btn" type="button" data-a="resume">Continuar</button></div>`;ov.hidden=false}});
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(layout,60)});
$("mute").addEventListener("click",()=>{setMute(!muted);unlock()});
$("themeBtn").addEventListener("click",()=>setTheme(document.documentElement.dataset.ppTheme==="light"?"dark":"light",true));
setTheme(document.documentElement.dataset.ppTheme==="light"?"light":"dark");setMute(muted);
layout();pickScreen();requestAnimationFrame(t=>{last=t;loop(t)});

</script>
<script>/* ===== Ecrã completo (menu e todos os jogos) =====
   O navegador sai do ecrã completo sempre que muda de página. Para não sair ao andar entre jogos,
   quando se está em ecrã completo os links do site abrem por cima, numa moldura (iframe) que ocupa o ecrã todo:
   a página de fora nunca muda e o ecrã completo mantém-se. O endereço e o botão "voltar" continuam a funcionar.
   A escolha fica guardada; se mesmo assim se mudar de página, volta a entrar no primeiro toque. */
(function(){
  const TOP=(()=>{try{return window.top!==window&&window.top.JFS&&window.top.JFS.shell?window.top:null}catch(e){return null}})();
  const D=TOP?TOP.document:document,de=D.documentElement;
  const can=!!(D.fullscreenEnabled||D.webkitFullscreenEnabled);
  const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
  /* app instalada em ecrã completo: já está tudo no ecrã, o botão não faz falta */
  const APPFS=matchMedia("(display-mode: fullscreen)").matches;
  /* app instalada que ainda abre com as barras (o Chrome demora a atualizar a app): entra em ecrã completo no primeiro toque,
     sempre que se abre a app (a escolha de sair só dura até fechar a app) */
  const APPSA=!APPFS&&(matchMedia("(display-mode: standalone)").matches||navigator.standalone===true);
  const get=()=>{if(APPFS)return false;try{if(APPSA){const v=sessionStorage.getItem("pp-fs-app");return v!=="0"}return localStorage.getItem("pp-fs")==="1"}catch(e){return APPSA}};
  const set=v=>{try{if(APPSA)sessionStorage.setItem("pp-fs-app",v?"1":"0");else localStorage.setItem("pp-fs",v?"1":"0")}catch(e){}};
  const enter=()=>{try{const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)return p.catch(()=>{});return Promise.resolve()}catch(e){return Promise.resolve()}};
  const leave=()=>{try{if(!isFs())return;const p=(D.exitFullscreen||D.webkitExitFullscreen).call(D);if(p&&p.catch)p.catch(()=>{})}catch(e){}};
  const JFS={can,isFs,wanted:get,enter,leave,framed:!!TOP};
  window.JFS=JFS;
  /* rodar o ecrã: dentro da moldura tem de ser a página de fora a pedir */
  JFS.lockOr=o=>{const sc=(TOP||window).screen;return sc.orientation&&sc.orientation.lock?sc.orientation.lock(o):Promise.reject()};
  JFS.unlockOr=()=>{try{const sc=(TOP||window).screen;sc.orientation&&sc.orientation.unlock&&sc.orientation.unlock()}catch(e){}};
  /* ir para o menu (passa pela moldura se for caso disso) */
  JFS.home=()=>{const a=document.createElement("a");a.href=new URL("../",location.href).href;a.style.display="none";document.body.appendChild(a);a.click();a.remove()};

  /* ---- links do site ---- */
  const sameSite=a=>{
    if(!a||a.target&&a.target!=="_self"||a.hasAttribute("download"))return null;
    let u;try{u=new URL(a.href,location.href)}catch(e){return null}
    if(u.origin!==location.origin)return null;
    if(u.href.split("#")[0]===location.href.split("#")[0])return null; /* só muda o # */
    return u.href;
  };
  if(TOP){
    /* dentro da moldura: os links vão para a página de fora tratar */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();TOP.JFS.go(h)},false);
  }else{
    JFS.shell=true;
    const HOME=location.href.split("#")[0],baseTitle=document.title;let fr=null,bk=null,syncT=0;
    /* a zona da câmara e da barra de baixo fica com a mesma cor e padrão do jogo que está aberto */
    const meta=document.querySelector('meta[name="theme-color"]');
    const sync=()=>{try{const d=fr.contentDocument;if(!d||!d.body)return;const pl=d.getElementById("play");const el=pl&&!pl.hidden?pl:d.body;const cs=getComputedStyle(el);let bg=cs.backgroundColor;if(el===d.body&&(bg==="rgba(0, 0, 0, 0)"||bg==="transparent"))bg=getComputedStyle(d.documentElement).backgroundColor;
      bk.style.backgroundColor=bg;bk.style.backgroundImage=cs.backgroundImage;bk.style.backgroundSize=cs.backgroundSize;if(meta)meta.content=bg}catch(e){}};
    const close=()=>{if(!fr)return;clearInterval(syncT);fr.remove();fr=null;if(bk){bk.remove();bk=null}document.documentElement.style.overflow="";document.title=baseTitle};
    const show=href=>{
      if(href.split("#")[0]===HOME){close();return}
      if(!fr){
        fr=document.createElement("iframe");fr.id="jfsFrame";fr.title="Jogo";
        fr.allow="fullscreen; web-share; clipboard-write; accelerometer; gyroscope; autoplay; screen-wake-lock";fr.setAttribute("allowfullscreen","");
        /* dentro de uma moldura o env(safe-area-inset-*) vale 0, por isso é a moldura que fica fora da câmara e dos cantos */fr.style.cssText="position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg,#f4eee3)";bk=document.createElement("div");bk.style.cssText="position:fixed;inset:0;z-index:2147483000;background:var(--bg,#f4eee3)";document.body.appendChild(bk);
        fr.src=href;bk.appendChild(fr);document.documentElement.style.overflow="hidden";
        fr.addEventListener("load",()=>{try{document.title=fr.contentDocument.title}catch(e){}sync()});syncT=setInterval(sync,300);
      }else{try{fr.contentWindow.location.replace(href)}catch(e){fr.src=href}}
    };
    JFS.go=href=>{
      const st=history.state&&history.state.jf?history.state:null;
      if(href.split("#")[0]===HOME){if(st&&st.i>0)history.go(-st.i);else close();return}
      const i=(st?st.i:0)+1;
      history.pushState({jf:href,i},"",href);show(href);
    };
    addEventListener("popstate",e=>{const s=e.state;if(s&&s.jf)show(s.jf);else close()});
    if(history.state&&history.state.jf)history.replaceState(null,"",HOME);
    /* jogo aberto diretamente (atalho, link de convite): o botão "voltar" do telemóvel leva ao menu em vez de sair do site */
    if(!document.querySelector("nav.games")&&document.querySelector('a[href="../"]')){
      const HUB=new URL("../",location.href).href,ref=(document.referrer||"").split("#")[0];
      if(ref!==HUB&&!(history.state&&history.state.jg)){const here=location.href;try{history.replaceState({jhub:1},"",HUB);history.pushState({jg:1},"",here)}catch(e){}}
      addEventListener("popstate",e=>{if(e.state&&e.state.jhub)location.replace(HUB)});
    }
    /* em ecrã completo, os links do site abrem na moldura */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;if(!isFs()&&!fr&&!get())return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();JFS.go(h)},false);
  }
  if(!can||APPFS)return;

  /* ---- botão ---- */
  const IN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  let btn=document.getElementById("fsBtn");
  if(btn){const c=btn.cloneNode(false);c.removeAttribute("aria-pressed");btn.replaceWith(c);btn=c} /* a Panela tinha o seu; passa a usar este */
  else{
    const tools=document.querySelector("header .tools");if(!tools)return;
    btn=document.createElement("button");btn.className="btn ghost sm ico";btn.id="fsBtn";btn.type="button";
    const tb=document.getElementById("themeBtn");tools.insertBefore(btn,tb||null);
  }
  const st=document.createElement("style");
  st.textContent="#fsBtn{display:inline-grid;place-items:center}#fsBtn[hidden]{display:none}#fsBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}";
  document.head.appendChild(st);
  const upd=()=>{const f=isFs();btn.innerHTML=f?OUT:IN;btn.title=f?"Sair do ecrã completo":"Ecrã completo";btn.setAttribute("aria-label",btn.title);if(window.dispatchEvent)setTimeout(()=>dispatchEvent(new Event("resize")),250)};
  upd();D.addEventListener("fullscreenchange",upd);D.addEventListener("webkitfullscreenchange",upd);
  btn.hidden=false;
  btn.addEventListener("click",()=>{const f=isFs();set(!f);f?leave():enter()});
  if(TOP)return;
  /* guardar a escolha */
  let leaving=false;addEventListener("pagehide",()=>{leaving=true});
  const onChange=()=>{if(!isFs()&&!leaving&&document.visibilityState==="visible")set(false)};
  document.addEventListener("fullscreenchange",onChange);document.addEventListener("webkitfullscreenchange",onChange);
  /* se mesmo assim mudou de página: volta a entrar no primeiro toque */
  if(get()&&!isFs()){
    const off=()=>{removeEventListener("click",once,true);removeEventListener("touchend",once,true)};
    const once=e=>{if(e.target&&e.target.closest&&e.target.closest("#fsBtn"))return;off();if(!isFs())enter()};
    addEventListener("click",once,true);addEventListener("touchend",once,true);
  }
})();
</script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}))</script></body>
