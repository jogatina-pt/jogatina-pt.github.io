<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Cobri<span>nha</span></h1><a class="home" id="hubLink" href="../">← mais jogos</a></div>
    <div class="tools">
      <button class="btn ghost sm ico" id="mute" type="button" aria-pressed="true" aria-label="Som" title="Som">🔊</button>
      <button class="btn ghost sm ico" id="themeBtn" type="button" aria-label="Tema escuro" title="Tema escuro">☾</button>
    </div>
  </header>
  <main class="phone" aria-label="Jogo da cobrinha">
    <div class="screen" id="screen">
      <canvas id="cv" aria-label="Ecrã do jogo"></canvas>
      <div class="ov" id="ov"></div>
    </div>
    <div class="keys" id="keys">
      <button class="key blank" type="button" data-k="1" tabindex="-1">1</button>
      <button class="key dir" type="button" data-k="2" aria-label="Cima">2<small>▲</small></button>
      <button class="key blank" type="button" data-k="3" tabindex="-1">3</button>
      <button class="key dir" type="button" data-k="4" aria-label="Esquerda">4<small>◀</small></button>
      <button class="key mid" type="button" data-k="5" aria-label="Jogar ou pausa">5<small>▶ ❚❚</small></button>
      <button class="key dir" type="button" data-k="6" aria-label="Direita">6<small>▶</small></button>
      <button class="key blank" type="button" data-k="7" tabindex="-1">7</button>
      <button class="key dir" type="button" data-k="8" aria-label="Baixo">8<small>▼</small></button>
      <button class="key blank" type="button" data-k="9" tabindex="-1">9</button>
    </div>
  </main>
  <p class="foot">Também dá para deslizar o dedo no ecrã ou usar as setas do teclado.</p>
</div>
<script>
/* ================= COBRINHA =================
   A cobra dos telemóveis antigos. Teclas 2/4/6/8 (ou setas, ou deslizar) para virar, 5 para jogar/pausa.
   Cada comida vale tantos pontos quanto o nível. A cada 5 comidas aparece um bicho bónus por pouco tempo. */
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov"),screenEl=$("screen");
const INK="#22341a",LCD="#a8c27c",GHOST="rgba(34,52,26,.045)";
const DIRS={2:[0,-1],8:[0,1],4:[-1,0],6:[1,0]};
let level=Math.min(9,Math.max(1,+store.get("cobra-nivel")||5)),walls=store.get("cobra-paredes")!=="0";
const recKey=()=>"cobra-rec-"+(walls?"paredes":"livre");
let S=null; /* estado do jogo */
let state="menu"; /* menu | play | pause | dead | over */

/* ---------- som (bipes de telemóvel antigo) ---------- */
let AC=null,muted=store.get("pp-mute")==="1";
function unlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume()}catch(e){}}
function beep(f,d,at=0,v=.06){if(muted||!AC||AC.state!=="running")return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(0,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.01)}
const SFX={eat:()=>beep(1300,.04),bonus:()=>{beep(1500,.05);beep(1900,.07,.06)},spawn:()=>beep(900,.03),die:()=>{[700,520,380,260].forEach((f,i)=>beep(f,.12,i*.13,.07))},start:()=>{beep(988,.06);beep(1319,.09,.08)},rec:()=>[1047,1319,1568,2093].forEach((f,i)=>beep(f,.09,i*.1))};
const sfx=k=>{try{SFX[k]()}catch(e){}};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function setMute(m){muted=m;store.set("pp-mute",m?"1":"0");$("mute").textContent=m?"🔇":"🔊";$("mute").setAttribute("aria-pressed",String(!m))}
function setTheme(t,save){if(t==="light")document.documentElement.dataset.ppTheme="light";else delete document.documentElement.dataset.ppTheme;if(save)store.set("pp-tema",t);const tb=$("themeBtn");tb.textContent=t==="light"?"☾":"☀";tb.title=t==="light"?"Tema escuro":"Tema claro"}

/* ---------- ecrã ligado durante o jogo ---------- */
let WL=null;
async function keepAwake(on){try{if(on&&!WL&&navigator.wakeLock&&!document.hidden){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}else if(!on&&WL){const w=WL;WL=null;await w.release()}}catch(e){}}

/* ---------- grelha e desenho ---------- */
let G={cols:20,rows:24,cell:16,ox:0,oy:0,bar:0,dpr:1};
function layout(){
  const r=screenEl.getBoundingClientRect(),dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  G.dpr=dpr;
  const W=r.width,H=r.height,pad=10,bar=24;
  if(!S){ /* a grelha só muda entre jogos */
    const cell=Math.max(11,Math.floor(Math.min((W-pad*2)/17,(H-pad*2-bar)/13)));
    G.cols=Math.max(12,Math.floor((W-pad*2)/cell));G.rows=Math.max(10,Math.floor((H-pad*2-bar)/cell));
  }
  G.cell=Math.min((W-pad*2)/G.cols,(H-pad*2-bar)/G.rows);
  G.bar=bar;G.ox=(W-G.cell*G.cols)/2;G.oy=bar+(H-bar-G.cell*G.rows)/2;
  draw();
}
function px(x,y,w,h){ctx.fillRect(Math.round(x*G.dpr),Math.round(y*G.dpr),Math.max(1,Math.round(w*G.dpr)),Math.max(1,Math.round(h*G.dpr)))}
function cellRect(cx,cy,inset){const c=G.cell,i=inset*c;px(G.ox+cx*c+i,G.oy+cy*c+i,c-2*i,c-2*i)}
/* bicho bónus: desenho de 5x5 pixéis */
const BUG=["01010","11111","10101","11111","01010"];
const FOOD=["010","101","010"];
function sprite(cx,cy,pat){const c=G.cell,n=pat.length,s=c*.84/n,o=c*.08;for(let j=0;j<n;j++)for(let i=0;i<pat[j].length;i++)if(pat[j][i]==="1")px(G.ox+cx*c+o+i*s,G.oy+cy*c+o+j*s,s+.4,s+.4)}
function draw(){
  const W=cv.width/G.dpr,H=cv.height/G.dpr;
  ctx.fillStyle=LCD;ctx.fillRect(0,0,cv.width,cv.height);
  /* pixéis apagados, como num LCD */
  ctx.fillStyle=GHOST;for(let y=0;y<G.rows;y++)for(let x=0;x<G.cols;x++)cellRect(x,y,.1);
  ctx.fillStyle=INK;
  /* barra de cima: pontos e bónus */
  ctx.font=`900 ${Math.round(16*G.dpr)}px ui-monospace,"Courier New",monospace`;ctx.textBaseline="middle";
  const sc=S?S.score:0;ctx.textAlign="left";ctx.fillText(String(sc).padStart(4,"0"),G.ox*G.dpr,(G.bar/2+2)*G.dpr);
  ctx.textAlign="right";
  if(S&&S.bonus){ctx.fillText(String(S.bonus.left).padStart(2,"0"),(W-G.ox)*G.dpr,(G.bar/2+2)*G.dpr);sprite((W-G.ox-46-G.ox)/G.cell,(2-G.oy)/G.cell,BUG)}
  else ctx.fillText("N"+level+(walls?"":" ∞"),(W-G.ox)*G.dpr,(G.bar/2+2)*G.dpr);
  px(G.ox,G.bar-1,G.cell*G.cols,2);
  /* moldura (com paredes: linha cheia; sem paredes: tracejada) */
  if(walls){px(G.ox-3,G.oy-3,G.cell*G.cols+6,2);px(G.ox-3,G.oy+G.cell*G.rows+1,G.cell*G.cols+6,2);px(G.ox-3,G.oy-3,2,G.cell*G.rows+6);px(G.ox+G.cell*G.cols+1,G.oy-3,2,G.cell*G.rows+6)}
  else{for(let x=0;x<G.cols;x+=2){px(G.ox+x*G.cell,G.oy-3,G.cell,2);px(G.ox+x*G.cell,G.oy+G.cell*G.rows+1,G.cell,2)}for(let y=0;y<G.rows;y+=2){px(G.ox-3,G.oy+y*G.cell,2,G.cell);px(G.ox+G.cell*G.cols+1,G.oy+y*G.cell,2,G.cell)}}
  if(!S)return;
  if(S.food)sprite(S.food.x,S.food.y,FOOD);
  if(S.bonus&&(S.bonus.left>5||S.tick%2===0))sprite(S.bonus.x,S.bonus.y,BUG);
  if(S.dead&&S.blink%2===1)return;
  S.body.forEach((p,i)=>{
    if(i===0){cellRect(p.x,p.y,.04);/* olho */ctx.fillStyle=LCD;const c=G.cell,d=S.dir,ex=G.ox+p.x*c+c*(.5+d[0]*.18-d[1]*.2),ey=G.oy+p.y*c+c*(.5+d[1]*.18+d[0]*.2);px(ex-c*.1,ey-c*.1,c*.2,c*.2);ctx.fillStyle=INK}
    else{ /* segmentos ligados ao anterior, como no original */
      const q=S.body[i-1],c=G.cell,g=c*.12;
      const x0=Math.min(p.x,q.x),y0=Math.min(p.y,q.y),wrap=Math.abs(p.x-q.x)>1||Math.abs(p.y-q.y)>1;
      cellRect(p.x,p.y,.12);
      if(!wrap){if(p.x!==q.x)px(G.ox+x0*c+c-g,G.oy+p.y*c+g,2*g,c-2*g);else px(G.ox+p.x*c+g,G.oy+y0*c+c-g,c-2*g,2*g)}
      if(S.fat&&S.fat.has(p.x+","+p.y))cellRect(p.x,p.y,-.02);
    }
  });
}

/* ---------- jogo ---------- */
const speed=()=>Math.round(330-level*31); /* nível 1 = 300 ms … nível 9 = 51 ms */
function freeCell(){
  const occ=new Set(S.body.map(p=>p.x+","+p.y));if(S.food)occ.add(S.food.x+","+S.food.y);if(S.bonus)occ.add(S.bonus.x+","+S.bonus.y);
  const free=[];for(let y=0;y<G.rows;y++)for(let x=0;x<G.cols;x++)if(!occ.has(x+","+y))free.push({x,y});
  return free.length?free[Math.floor(Math.random()*free.length)]:null;
}
function start(){
  unlock();S=null;layout();
  const cy=Math.floor(G.rows/2),cx=Math.floor(G.cols/2)-2;
  S={body:[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy},{x:cx-3,y:cy}],dir:[1,0],queue:[],grow:0,score:0,eaten:0,food:null,bonus:null,tick:0,dead:false,blink:0,fat:new Set(),rec:+store.get(recKey())||0};
  S.food=freeCell();
  state="play";ov.hidden=true;sfx("start");keepAwake(true);
  schedule();draw();
}
let timer=0;
function schedule(){clearTimeout(timer);timer=setTimeout(step,speed()/(window.__fast?8:1))}
function turn(k){
  const d=DIRS[k];if(!d)return;
  if(state!=="play")return;
  const last=S.queue.length?S.queue[S.queue.length-1]:S.dir;
  if(d[0]===-last[0]&&d[1]===-last[1])return; /* não dá para voltar para trás */
  if(d[0]===last[0]&&d[1]===last[1])return;
  if(S.queue.length<3)S.queue.push(d);
}
function step(){
  if(state!=="play"||!S)return;
  S.tick++;
  if(S.queue.length)S.dir=S.queue.shift();
  const h=S.body[0];let nx=h.x+S.dir[0],ny=h.y+S.dir[1];
  if(!walls){nx=(nx+G.cols)%G.cols;ny=(ny+G.rows)%G.rows}
  const hit=nx<0||ny<0||nx>=G.cols||ny>=G.rows||S.body.some((p,i)=>p.x===nx&&p.y===ny&&!(i===S.body.length-1&&S.grow===0));
  if(hit){die();return}
  S.body.unshift({x:nx,y:ny});
  if(S.grow>0)S.grow--;else{const t=S.body.pop();S.fat.delete(t.x+","+t.y)}
  if(S.food&&nx===S.food.x&&ny===S.food.y){
    S.score+=level;S.eaten++;S.grow+=1;S.fat.add(nx+","+ny);sfx("eat");buzz(15);
    S.food=freeCell();
    if(S.eaten%5===0&&!S.bonus){const c=freeCell();if(c){S.bonus={x:c.x,y:c.y,left:20};sfx("spawn")}}
  }
  if(S.bonus&&nx===S.bonus.x&&ny===S.bonus.y){
    const pts=level*(5+S.bonus.left);S.score+=pts;S.grow+=2;S.fat.add(nx+","+ny);S.bonus=null;sfx("bonus");buzz([20,30,20]);
  }else if(S.bonus&&S.tick%2===0){S.bonus.left--;if(S.bonus.left<=0)S.bonus=null}
  if(!S.food&&!S.bonus){win();return}
  draw();schedule();
}
function die(){
  state="dead";S.dead=true;sfx("die");buzz([60,40,120]);keepAwake(false);
  let n=0;const fl=()=>{S.blink=++n;draw();if(n<7)timer=setTimeout(fl,160);else over()};fl();
}
function win(){S.score+=level*50;draw();die()}
function over(){
  state="over";
  const rec=S.score>S.rec;if(rec){store.set(recKey(),String(S.score));sfx("rec")}
  showOv(`<h2>FIM</h2><p class="big">${S.score}</p><p>${rec?"★ NOVO RECORDE! ★":"Recorde: "+Math.max(S.rec,S.score)}</p><p>Tamanho: ${S.body.length}</p>
    <button class="go" type="button" data-a="go">5 · OUTRA VEZ</button><button class="go" type="button" data-a="menu" style="background:transparent;color:var(--ink-lcd);border:2px solid var(--ink-lcd)">MENU</button>`);
}
function pause(){if(state!=="play")return;state="pause";clearTimeout(timer);keepAwake(false);showOv(`<h2>PAUSA</h2><p>Pontos: ${S.score}</p><button class="go" type="button" data-a="resume">5 · CONTINUAR</button><button class="go" type="button" data-a="menu" style="background:transparent;color:var(--ink-lcd);border:2px solid var(--ink-lcd)">SAIR</button>`,true)}
function resume(){if(state!=="pause")return;state="play";ov.hidden=true;keepAwake(true);schedule()}
function showOv(html,dim){ov.innerHTML=html;ov.className="ov"+(dim?" dim":"");ov.hidden=false}
function menu(){
  clearTimeout(timer);state="menu";S=null;keepAwake(false);layout();
  showOv(`<h2>COBRINHA</h2>
    <div class="rows">
      <div class="row"><button type="button" data-a="lv-" aria-label="Menos rápido">◀</button><span>NÍVEL <b>${level}</b></span><button type="button" data-a="lv+" aria-label="Mais rápido">▶</button></div>
      <div class="row"><button type="button" data-a="wl" aria-label="Mudar paredes">◀</button><span>PAREDES <b>${walls?"SIM":"NÃO"}</b></span><button type="button" data-a="wl" aria-label="Mudar paredes">▶</button></div>
    </div>
    <p>Recorde: ${+store.get(recKey())||0}</p>
    <button class="go" type="button" data-a="go">5 · JOGAR</button>`);
}
ov.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;unlock();const a=b.dataset.a;
  if(a==="go")start();else if(a==="resume")resume();else if(a==="menu")menu();
  else if(a==="lv-"||a==="lv+"){level=Math.min(9,Math.max(1,level+(a==="lv+"?1:-1)));store.set("cobra-nivel",String(level));beep(1100,.03);menu()}
  else if(a==="wl"){walls=!walls;store.set("cobra-paredes",walls?"1":"0");beep(1100,.03);menu()}
});
function key5(){unlock();if(state==="play")pause();else if(state==="pause")resume();else if(state==="menu"||state==="over")start()}

/* ---------- comandos ---------- */
const keysEl=$("keys");
keysEl.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".key");if(!b)return;e.preventDefault();unlock();
  b.classList.add("on");setTimeout(()=>b.classList.remove("on"),110);
  const k=+b.dataset.k;
  if(k===5)key5();
  else if(DIRS[k])turn(k);
  else beep(800,.02);
  buzz(8);
});
keysEl.addEventListener("click",e=>e.preventDefault());
const KMAP={ArrowUp:2,ArrowDown:8,ArrowLeft:4,ArrowRight:6,w:2,s:8,a:4,d:6,W:2,S:8,A:4,D:6,2:2,8:8,4:4,6:6};
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT")return;
  if(KMAP[e.key]){e.preventDefault();turn(KMAP[e.key]);return}
  if(e.key===" "||e.key==="5"||e.key==="Enter"||e.key==="p"||e.key==="P"){e.preventDefault();key5()}
  if(e.key==="Escape"&&state==="play")pause();
});
/* deslizar o dedo no ecrã */
let sw=null;
screenEl.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;sw={x:e.clientX,y:e.clientY,id:e.pointerId,moved:false}});
screenEl.addEventListener("pointermove",e=>{
  if(!sw||e.pointerId!==sw.id||state!=="play")return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
  turn(Math.abs(dx)>Math.abs(dy)?(dx>0?6:4):(dy>0?8:2));sw={x:e.clientX,y:e.clientY,id:e.pointerId,moved:true};
});
screenEl.addEventListener("pointerup",e=>{if(sw&&!sw.moved&&state==="play"&&!e.target.closest("button")){/* toque simples: nada */}sw=null});
screenEl.addEventListener("pointercancel",()=>{sw=null});
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(layout,80)});
$("mute").addEventListener("click",()=>{setMute(!muted);unlock()});
$("themeBtn").addEventListener("click",()=>setTheme(document.documentElement.dataset.ppTheme==="light"?"dark":"light",true));
setTheme(document.documentElement.dataset.ppTheme==="light"?"light":"dark");setMute(muted);
menu();

</script>
<script>/* ===== Ecrã completo (menu e todos os jogos) =====
   O navegador sai do ecrã completo sempre que muda de página. Para não sair ao andar entre jogos,
   quando se está em ecrã completo os links do site abrem por cima, numa moldura (iframe) que ocupa o ecrã todo:
   a página de fora nunca muda e o ecrã completo mantém-se. O endereço e o botão "voltar" continuam a funcionar.
   A escolha fica guardada; se mesmo assim se mudar de página, volta a entrar no primeiro toque. */
(function(){
  const TOP=(()=>{try{return window.top!==window&&window.top.JFS&&window.top.JFS.shell?window.top:null}catch(e){return null}})();
  const D=TOP?TOP.document:document,de=D.documentElement;
  const can=!!(D.fullscreenEnabled||D.webkitFullscreenEnabled);
  const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
  const get=()=>{try{return localStorage.getItem("pp-fs")==="1"}catch(e){return false}};
  const set=v=>{try{localStorage.setItem("pp-fs",v?"1":"0")}catch(e){}};
  const enter=()=>{try{const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)return p.catch(()=>{});return Promise.resolve()}catch(e){return Promise.resolve()}};
  const leave=()=>{try{if(!isFs())return;const p=(D.exitFullscreen||D.webkitExitFullscreen).call(D);if(p&&p.catch)p.catch(()=>{})}catch(e){}};
  const JFS={can,isFs,wanted:get,enter,leave,framed:!!TOP};
  window.JFS=JFS;
  /* rodar o ecrã: dentro da moldura tem de ser a página de fora a pedir */
  JFS.lockOr=o=>{const sc=(TOP||window).screen;return sc.orientation&&sc.orientation.lock?sc.orientation.lock(o):Promise.reject()};
  JFS.unlockOr=()=>{try{const sc=(TOP||window).screen;sc.orientation&&sc.orientation.unlock&&sc.orientation.unlock()}catch(e){}};
  /* ir para o menu (passa pela moldura se for caso disso) */
  JFS.home=()=>{const a=document.createElement("a");a.href=new URL("../",location.href).href;a.style.display="none";document.body.appendChild(a);a.click();a.remove()};

  /* ---- links do site ---- */
  const sameSite=a=>{
    if(!a||a.target&&a.target!=="_self"||a.hasAttribute("download"))return null;
    let u;try{u=new URL(a.href,location.href)}catch(e){return null}
    if(u.origin!==location.origin)return null;
    if(u.href.split("#")[0]===location.href.split("#")[0])return null; /* só muda o # */
    return u.href;
  };
  if(TOP){
    /* dentro da moldura: os links vão para a página de fora tratar */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();TOP.JFS.go(h)},false);
  }else{
    JFS.shell=true;
    const HOME=location.href.split("#")[0],baseTitle=document.title;let fr=null,bk=null,syncT=0;
    /* a zona da câmara e da barra de baixo fica com a mesma cor e padrão do jogo que está aberto */
    const meta=document.querySelector('meta[name="theme-color"]');
    const sync=()=>{try{const d=fr.contentDocument;if(!d||!d.body)return;const pl=d.getElementById("play");const el=pl&&!pl.hidden?pl:d.body;const cs=getComputedStyle(el);let bg=cs.backgroundColor;if(el===d.body&&(bg==="rgba(0, 0, 0, 0)"||bg==="transparent"))bg=getComputedStyle(d.documentElement).backgroundColor;
      bk.style.backgroundColor=bg;bk.style.backgroundImage=cs.backgroundImage;bk.style.backgroundSize=cs.backgroundSize;if(meta)meta.content=bg}catch(e){}};
    const close=()=>{if(!fr)return;clearInterval(syncT);fr.remove();fr=null;if(bk){bk.remove();bk=null}document.documentElement.style.overflow="";document.title=baseTitle};
    const show=href=>{
      if(href.split("#")[0]===HOME){close();return}
      if(!fr){
        fr=document.createElement("iframe");fr.id="jfsFrame";fr.title="Jogo";
        fr.allow="fullscreen; web-share; clipboard-write; accelerometer; gyroscope; autoplay; screen-wake-lock";fr.setAttribute("allowfullscreen","");
        /* dentro de uma moldura o env(safe-area-inset-*) vale 0, por isso é a moldura que fica fora da câmara e dos cantos */fr.style.cssText="position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg,#f4eee3)";bk=document.createElement("div");bk.style.cssText="position:fixed;inset:0;z-index:2147483000;background:var(--bg,#f4eee3)";document.body.appendChild(bk);
        fr.src=href;bk.appendChild(fr);document.documentElement.style.overflow="hidden";
        fr.addEventListener("load",()=>{try{document.title=fr.contentDocument.title}catch(e){}sync()});syncT=setInterval(sync,300);
      }else{try{fr.contentWindow.location.replace(href)}catch(e){fr.src=href}}
    };
    JFS.go=href=>{
      const st=history.state&&history.state.jf?history.state:null;
      if(href.split("#")[0]===HOME){if(st&&st.i>0)history.go(-st.i);else close();return}
      const i=(st?st.i:0)+1;
      history.pushState({jf:href,i},"",href);show(href);
    };
    addEventListener("popstate",e=>{const s=e.state;if(s&&s.jf)show(s.jf);else close()});
    if(history.state&&history.state.jf)history.replaceState(null,"",HOME);
    /* jogo aberto diretamente (atalho, link de convite): o botão "voltar" do telemóvel leva ao menu em vez de sair do site */
    if(!document.querySelector("nav.games")&&document.querySelector('a[href="../"]')){
      const HUB=new URL("../",location.href).href,ref=(document.referrer||"").split("#")[0];
      if(ref!==HUB&&!(history.state&&history.state.jg)){const here=location.href;try{history.replaceState({jhub:1},"",HUB);history.pushState({jg:1},"",here)}catch(e){}}
      addEventListener("popstate",e=>{if(e.state&&e.state.jhub)location.replace(HUB)});
    }
    /* em ecrã completo, os links do site abrem na moldura */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;if(!isFs()&&!fr&&!get())return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();JFS.go(h)},false);
  }
  if(!can)return;

  /* ---- botão ---- */
  const IN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  let btn=document.getElementById("fsBtn");
  if(btn){const c=btn.cloneNode(false);c.removeAttribute("aria-pressed");btn.replaceWith(c);btn=c} /* a Panela tinha o seu; passa a usar este */
  else{
    const tools=document.querySelector("header .tools");if(!tools)return;
    btn=document.createElement("button");btn.className="btn ghost sm ico";btn.id="fsBtn";btn.type="button";
    const tb=document.getElementById("themeBtn");tools.insertBefore(btn,tb||null);
  }
  const st=document.createElement("style");
  st.textContent="#fsBtn{display:inline-grid;place-items:center}#fsBtn[hidden]{display:none}#fsBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}";
  document.head.appendChild(st);
  const upd=()=>{const f=isFs();btn.innerHTML=f?OUT:IN;btn.title=f?"Sair do ecrã completo":"Ecrã completo";btn.setAttribute("aria-label",btn.title);if(window.dispatchEvent)setTimeout(()=>dispatchEvent(new Event("resize")),250)};
  upd();D.addEventListener("fullscreenchange",upd);D.addEventListener("webkitfullscreenchange",upd);
  btn.hidden=false;
  btn.addEventListener("click",()=>{const f=isFs();set(!f);f?leave():enter()});
  if(TOP)return;
  /* guardar a escolha */
  let leaving=false;addEventListener("pagehide",()=>{leaving=true});
  const onChange=()=>{if(!isFs()&&!leaving&&document.visibilityState==="visible")set(false)};
  document.addEventListener("fullscreenchange",onChange);document.addEventListener("webkitfullscreenchange",onChange);
  /* se mesmo assim mudou de página: volta a entrar no primeiro toque */
  if(get()&&!isFs()){
    const off=()=>{removeEventListener("click",once,true);removeEventListener("touchend",once,true)};
    const once=e=>{if(e.target&&e.target.closest&&e.target.closest("#fsBtn"))return;off();if(!isFs())enter()};
    addEventListener("click",once,true);addEventListener("touchend",once,true);
  }
})();
</script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}))</script></body>
