      <button class="btn ghost sm ico" id="mute" type="button" aria-pressed="true" aria-label="Som" title="Som">🔊</button>
      <button class="btn ghost sm ico" id="themeBtn" type="button" aria-label="Tema escuro" title="Tema escuro">☾</button>

/* ================= DIZ O POVO (respostas mais populares, offline) =================
   Modos: sozinho (5 perguntas, 3 erros cada), a dois num telemóvel (disputa, jogo e roubo) e com apresentador (equipas).
   As respostas escritas são reconhecidas por alternativas, sem acentos, plurais ou artigos e com pequenos erros. */
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const BANK=QS.trim().split("\n").map((l,id)=>{const [q,...as]=l.split("|");return{id,q,a:as.map(x=>{const [t,p,al]=x.split("=");return{t,p:+p,al:[t,...(al?al.split(","):[])]}}).sort((a,b)=>b.p-a.p)}});
/* ---------- reconhecer respostas ---------- */
const STOP=new Set("o a os as um uma uns umas de do da dos das no na nos nas em ao aos à às e com para por pelo pela que se meu minha eu é".split(" "));
const deacc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function stem(w){if(w.length>6&&/zinh[oa]$/.test(w))w=w.slice(0,-5)+w.slice(-1);else if(w.length>6&&/inh[oa]$/.test(w))w=w.slice(0,-4)+w.slice(-1);if(w.length>=4&&/(oes|aes)$/.test(w))return w.slice(0,-3)+"ao";if(w.length>4&&/[rzl]es$/.test(w))return w.slice(0,-2);if(w.length>3&&w.endsWith("s"))return w.slice(0,-1);return w}
const toks=s=>deacc(String(s).toLowerCase()).replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w&&!STOP.has(w)).map(stem);
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const tol=n=>n>=8?2:n>=5?1:0;
/* devolve {i,score} da melhor resposta (score>=60 aceita; 35..59 é "parecida") */
function match(q,text){
  const K=toks(text),ks=K.join(" ");if(!ks)return null;let best=null;
  q.a.forEach((ans,i)=>{let sc=0;
    for(const al of ans.al){const A=toks(al),as=A.join(" ");if(!as)continue;
      if(as===ks)sc=Math.max(sc,100);
      else if(A.every(w=>K.includes(w)))sc=Math.max(sc,82);
      else if(lev(as,ks)<=tol(as.length))sc=Math.max(sc,75);
      else if(K.length&&K.every(w=>A.includes(w))&&K.join("").length>=4)sc=Math.max(sc,66);
      else if(A.length===1&&K.some(w=>lev(w,A[0])<=tol(A[0].length)&&A[0].length>=4))sc=Math.max(sc,64);
      else if(K.some(w=>w.length>=4&&A.some(x=>x.length>=4&&(x.startsWith(w.slice(0,4))||lev(w,x)<=tol(x.length)+1))))sc=Math.max(sc,40);
    }
    if(sc&&(!best||sc>best.score))best={i,score:sc}});
  return best;
}
/* ---------- baralho sem repetir ---------- */
function pickQ(){let used=[];try{used=JSON.parse(store.get("povo-used")||"[]")}catch(e){}
  let pool=BANK.filter(q=>!used.includes(q.id));if(pool.length<6){used=[];pool=BANK}
  const q=pool[Math.floor(Math.random()*pool.length)];used.push(q.id);store.set("povo-used",JSON.stringify(used));return q}
/* ---------- estado ---------- */
let S=null;const MULT=[1,1,2,3];
function newGame(mode,names){
  S={mode,players:names.map(n=>({name:n,score:0})),round:0,rounds:mode==="solo"?5:4,q:null,rev:[],strikes:0,pot:0,ctrl:0,phase:"",face:[],log:"",hist:[]};
  nextRound();
}
function nextRound(){
  if(S.round>=S.rounds){return endGame()}
  S.q=pickQ();S.rev=S.q.a.map(()=>false);S.strikes=0;S.pot=0;S.face=[];S.hist=[];S.mult=S.mode==="solo"?1:MULT[S.round];S.round++;
  if(S.mode==="solo"){S.phase="play";S.ctrl=0;say("Escreve as respostas que achas que o povo deu.")}
  else if(S.mode==="duo"){S.faceFirst=(S.round-1)%2;S.phase="face";S.ctrl=S.faceFirst;say(`Disputa! ${S.players[S.faceFirst].name} responde primeiro.`)}
  else{S.phase="pick";say("As equipas disputam a pergunta. Quem joga?")}
  show("game");render();sfx("round");focusInput();
}
const pts=i=>S.q.a[i].p*S.mult;
const allRev=()=>S.rev.every(Boolean);
function reveal(i){S.rev[i]=true;S.pot+=pts(i);flash(i);sfx("ding");buzz(15)}
function say(t){S.log=t}
function award(p){if(p!=null)S.players[p].score+=S.pot;const got=S.pot;S.pot=0;return got}
/* ---------- jogar uma resposta (sozinho e a dois) ---------- */
let pending=null;
function submit(text){
  if(!S||!text.trim())return;
  const m=match(S.q,text);
  if(m&&m.score>=60){if(S.rev[m.i]){say(`«${S.q.a[m.i].t}» já está no quadro!`);sfx("dup");render();return}return hit(m.i,text)}
  if(m&&m.score>=35&&!S.rev[m.i]){pending={i:m.i,text};askCount(m.i,text);return}
  miss(text);
}
function askCount(i,text){
  const who=S.mode==="duo"?`<p class="small">${S.players[1-curPlayer()].name}, és tu que decides.</p>`:"";
  showOv(`<div class="panel"><h2>Isto conta?</h2><p>Escreveste <b>«${esc(text)}»</b>. Conta como <b>«${S.q.a[i].t}»</b>?</p>${who}<div class="row2"><button class="btn" type="button" data-a="yes">Conta ✓</button><button class="btn ghost" type="button" data-a="no">Não conta ✗</button></div></div>`);
}
const curPlayer=()=>S.phase==="face"?(S.face.length===0?S.faceFirst:1-S.faceFirst):S.phase==="steal"?1-S.ctrl:S.ctrl;
function hit(i,text){
  const p=curPlayer();reveal(i);
  if(S.mode==="solo"){if(allRev()){say(`Limpaste o quadro! +${S.pot}`);finishQ()}else say(`Boa! «${S.q.a[i].t}» vale ${pts(i)}.`);render();return}
  if(S.phase==="face"){S.face.push({p,i});
    if(i===0||S.face.length===2){
      const hits=S.face.filter(f=>f.i>=0);const win=hits.length?hits.reduce((a,b)=>S.q.a[a.i].p>=S.q.a[b.i].p?a:b).p:S.faceFirst;
      S.ctrl=win;S.phase="play";say(i===0&&S.face.length===1?`A resposta mais dada! ${S.players[win].name} joga a pergunta.`:`${S.players[win].name} ganhou a disputa e joga a pergunta.`);
    }else{say(`Boa! Agora ${S.players[1-S.faceFirst].name}: consegues uma resposta mais popular?`)}
    if(allRev())roundEnd(S.ctrl);render();return}
  if(S.phase==="play"){if(allRev()){roundEnd(S.ctrl,`${S.players[S.ctrl].name} limpou o quadro!`)}else say(`Boa! Continua, ${S.players[S.ctrl].name}.`);render();return}
  if(S.phase==="steal"){roundEnd(1-S.ctrl,`${S.players[1-S.ctrl].name} roubou os pontos!`);render()}
}
function miss(text){
  const p=curPlayer();sfx("x");buzz([60,40,60]);
  if(S.mode==="solo"){S.strikes++;bigX(S.strikes);if(S.strikes>=3){say("Três erros!");finishQ()}else say(`«${esc(text)}» não está no quadro.`);render();return}
  if(S.phase==="face"){S.face.push({p,i:-1});bigX(1);
    if(S.face.length===2){const hits=S.face.filter(f=>f.i>=0);S.ctrl=hits.length?hits[0].p:S.faceFirst;S.phase="play";say(hits.length?`${S.players[S.ctrl].name} ganhou a disputa e joga a pergunta.`:`Ninguém acertou. ${S.players[S.ctrl].name} joga a pergunta.`)}
    else say(`Não está no quadro. Agora ${S.players[1-S.faceFirst].name}!`);render();return}
  if(S.phase==="play"){S.strikes++;bigX(S.strikes);if(S.strikes>=3){S.phase="steal";say(`Três erros! ${S.players[1-S.ctrl].name}, tens uma tentativa para roubar ${S.pot} pontos.`)}else say(`Não está no quadro. Ainda tens ${3-S.strikes} ${3-S.strikes===1?"vida":"vidas"}.`);render();return}
  if(S.phase==="steal"){roundEnd(S.ctrl,`Falhou o roubo! Os pontos ficam para ${S.players[S.ctrl].name}.`);render()}
}
function finishQ(){S.players[0].score+=S.pot;S.phase="done";sfx(S.pot>=60?"win":"round")}
function roundEnd(p,msg){const got=award(p);S.phase="done";if(msg)say(msg+` +${got}`);else say(`${S.players[p].name} ganha ${got} pontos.`);sfx("win")}
/* ---------- apresentador ---------- */
function snap(){S.hist.push(JSON.stringify({rev:S.rev,strikes:S.strikes,pot:S.pot,ctrl:S.ctrl,phase:S.phase,log:S.log,sc:S.players.map(p=>p.score)}))}
function undo(){const h=S.hist.pop();if(!h)return;const o=JSON.parse(h);S.rev=o.rev;S.strikes=o.strikes;S.pot=o.pot;S.ctrl=o.ctrl;S.phase=o.phase;S.log=o.log;o.sc.forEach((v,i)=>S.players[i].score=v);render()}
function hostTap(i){
  if(S.rev[i]||S.phase==="done")return;
  if(S.phase==="pick"){toast("Primeiro escolhe a equipa que joga.");return}
  snap();reveal(i);
  if(S.phase==="steal"){roundEnd(1-S.ctrl,`${S.players[1-S.ctrl].name} roubou os pontos!`)}
  else if(allRev())roundEnd(S.ctrl,`${S.players[S.ctrl].name} limpou o quadro!`);
  render();
}
function hostX(){
  if(S.phase==="pick"||S.phase==="done")return;snap();sfx("x");buzz([60,40,60]);
  if(S.phase==="steal"){roundEnd(S.ctrl,`Falhou o roubo! Os pontos ficam para ${S.players[S.ctrl].name}.`)}
  else{S.strikes++;bigX(S.strikes);if(S.strikes>=3){S.phase="steal";say(`Três erros! Roubo para ${S.players[1-S.ctrl].name}: uma só resposta.`)}else say(`Errado! ${3-S.strikes} ${3-S.strikes===1?"vida":"vidas"} para ${S.players[S.ctrl].name}.`)}
  render();
}
/* ---------- fim ---------- */
function endGame(){
  S.phase="over";const ps=S.players;
  if(S.mode==="solo"){const sc=ps[0].score,best=+(store.get("povo-rec")||0),rec=sc>best;if(rec)store.set("povo-rec",String(sc));
    showOv(`<div class="panel"><div class="eyebrow">Fim do jogo</div><h2>${sc} pontos</h2>${rec?'<div class="newrec">★ Novo recorde! ★</div>':`<p>Recorde: ${best}</p>`}<p>Em ${S.rounds} perguntas.</p><button class="btn" type="button" data-a="again">Jogar outra vez</button><button class="btn ghost" type="button" data-a="menu">Menu</button></div>`)}
  else{const w=ps[0].score===ps[1].score?null:ps[0].score>ps[1].score?0:1;
    showOv(`<div class="panel"><div class="eyebrow">Fim do jogo</div><h2>${w==null?"Empate!":`Ganhou ${esc(ps[w].name)}!`}</h2><div class="final">${ps.map((p,i)=>`<div class="${i===w?"win":""}"><span>${esc(p.name)}</span><b>${p.score}</b></div>`).join("")}</div><button class="btn" type="button" data-a="again">Jogar outra vez</button><button class="btn ghost" type="button" data-a="menu">Menu</button></div>`)}
  sfx("win");
}
/* ---------- desenho ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  if(!S||!S.q)return;const host=S.mode==="host",done=S.phase==="done";
  $("gRound").textContent=S.mode==="solo"?`Pergunta ${S.round} de ${S.rounds}`:`Ronda ${S.round} de ${S.rounds}`+(S.mult>1?` · pontos ×${S.mult}`:"");
  $("gQ").textContent=S.q.q;
  $("board").innerHTML=S.q.a.map((a,i)=>{const r=S.rev[i];const cls=r?"on":done?"miss":host?"host":"";
    return`<li class="slot ${cls}" data-i="${i}"><span class="n">${i+1}</span>${r||done||host?`<span class="t">${a.t}</span><span class="p">${a.p*S.mult}</span>`:`<span class="t"></span>`}</li>`}).join("");
  $("pot").textContent=S.pot;
  $("strikes").innerHTML=[0,1,2].map(k=>`<i class="${k<S.strikes?"on":""}">✕</i>`).join("");
  $("scores").innerHTML=S.mode==="solo"?`<div class="sc on"><span>Pontos</span><b>${S.players[0].score}</b></div>`:S.players.map((p,i)=>{const act=(S.phase==="face"&&curPlayer()===i)||((S.phase==="play"||S.phase==="pick")&&S.ctrl===i&&S.phase!=="pick")||(S.phase==="steal"&&1-S.ctrl===i);return`<div class="sc ${act?"on":""}"><span>${esc(p.name)}</span><b>${p.score}</b></div>`}).join("");
  $("log").innerHTML=S.log;
  const typing=!host&&!done;$("ansForm").hidden=!typing;
  if(typing){const p=curPlayer();$("ans").placeholder=S.mode==="solo"?"Escreve uma resposta…":`${S.players[p].name}, escreve…`;$("ansBtn").textContent=S.phase==="steal"?"Roubar!":"Responder"}
  $("hostBar").hidden=!host||done;
  if(host&&!done){$("hostBar").innerHTML=S.phase==="pick"?`<span class="lbl">Quem joga?</span>${S.players.map((p,i)=>`<button class="btn" type="button" data-ctrl="${i}">${esc(p.name)}</button>`).join("")}`:
    `<span class="lbl">${S.phase==="steal"?`Roubo: ${esc(S.players[1-S.ctrl].name)}`:`Joga: ${esc(S.players[S.ctrl].name)}`}</span><button class="btn xbtn" type="button" id="xBtn">✕ Errado</button><button class="btn ghost sm" type="button" id="undoBtn" ${S.hist.length?"":"disabled"}>↶ Desfazer</button>`}
  $("nextBtn").hidden=!done;$("nextBtn").textContent=S.round>=S.rounds?"Ver resultado ▶":S.mode==="solo"?"Próxima pergunta ▶":"Próxima ronda ▶";
  $("giveBtn").hidden=!(S.mode==="solo"&&!done);
  $("hostNote").hidden=!host||done;
}
function flash(i){requestAnimationFrame(()=>{const el=document.querySelector(`.slot[data-i="${i}"]`);if(el){el.classList.remove("flip");void el.offsetWidth;el.classList.add("flip")}})}
function bigX(n){const el=$("bigx");el.textContent="✕".repeat(Math.max(1,Math.min(3,n)));el.hidden=false;el.classList.remove("go");void el.offsetWidth;el.classList.add("go");clearTimeout(bigX.t);bigX.t=setTimeout(()=>el.hidden=true,900)}
let tt=0;function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200)}
function focusInput(){if(window.matchMedia("(pointer:fine)").matches)setTimeout(()=>{const i=$("ans");if(i&&!$("ansForm").hidden)i.focus()},50)}
/* ---------- ecrãs ---------- */
const ov=$("ov");function showOv(h){ov.innerHTML=h;ov.hidden=false}
function show(s){for(const id of ["menuScr","setupScr","gameScr"])$(id).hidden=id!==s+"Scr";keepAwake(s==="game")}
let setupMode="duo";
function setup(mode){setupMode=mode;const saved=(()=>{try{return JSON.parse(store.get("povo-nomes-"+mode)||"null")}catch(e){return null}})()||(mode==="duo"?["Jogador 1","Jogador 2"]:["Equipa Azul","Equipa Laranja"]);
  $("setupTitle").textContent=mode==="duo"?"A dois":"Com apresentador";
  $("setupInfo").innerHTML=mode==="duo"?"Passam o telemóvel um ao outro. Cada ronda começa com uma disputa: quem der a resposta mais popular joga a pergunta. Com 3 erros, o outro pode roubar os pontos.":"Um de vocês é o apresentador e fica com o telemóvel: vê as respostas, lê a pergunta e toca nas respostas que as equipas disserem em voz alta. <b>Não deixes os outros ver o ecrã!</b>";
  $("n1").value=saved[0];$("n2").value=saved[1];$("n1lbl").textContent=mode==="duo"?"Jogador 1":"Equipa 1";$("n2lbl").textContent=mode==="duo"?"Jogador 2":"Equipa 2";show("setup")}
$("mSolo").onclick=()=>{unlock();newGame("solo",["Tu"])};
$("mDuo").onclick=()=>{unlock();setup("duo")};
$("mHost").onclick=()=>{unlock();setup("host")};
$("setupBack").onclick=()=>show("menu");
$("setupGo").onclick=()=>{const n=[$("n1").value.trim()||($("n1lbl").textContent),$("n2").value.trim()||($("n2lbl").textContent)].map(x=>x.slice(0,16));store.set("povo-nomes-"+setupMode,JSON.stringify(n));newGame(setupMode,n)};
$("ansForm").addEventListener("submit",e=>{e.preventDefault();const v=$("ans").value;$("ans").value="";submit(v);focusInput()});
$("board").addEventListener("click",e=>{const li=e.target.closest(".slot");if(!li||!S)return;if(S.mode==="host")hostTap(+li.dataset.i)});
$("hostBar").addEventListener("click",e=>{const c=e.target.closest("[data-ctrl]");if(c){snap();S.ctrl=+c.dataset.ctrl;S.phase="play";say(`${S.players[S.ctrl].name} joga. Toca nas respostas certas ou em ✕.`);sfx("round");render();return}
  if(e.target.closest("#xBtn"))hostX();else if(e.target.closest("#undoBtn"))undo()});
$("nextBtn").onclick=()=>{nextRound()};
$("giveBtn").onclick=()=>{if(!S||S.phase==="done")return;say("Desististe desta pergunta.");finishQ();render()};
$("quitBtn").onclick=()=>{if(!S||S.phase==="over"){show("menu");return}showOv(`<div class="panel"><h2>Sair do jogo?</h2><p>Perdes os pontos desta partida.</p><button class="btn" type="button" data-a="menu">Sair</button><button class="btn ghost" type="button" data-a="close">Continuar a jogar</button></div>`)};
ov.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;ov.hidden=true;
  if(a==="yes"&&pending){const p=pending;pending=null;hit(p.i,p.text)}else if(a==="no"&&pending){const p=pending;pending=null;miss(p.text)}
  else if(a==="again"){newGame(S.mode,S.players.map(p=>p.name))}else if(a==="menu"){S=null;show("menu");menuInfo()}
  focusInput()});
function menuInfo(){const r=+(store.get("povo-rec")||0);$("mRec").textContent=r?`Recorde a solo: ${r} pontos`:"";$("mCount").textContent=BANK.length}
$("rulesBtn").onclick=()=>showOv(`<div class="panel rules"><h2>Como se joga</h2><ol><li>Cada pergunta tem as respostas mais populares, com pontos: quanto mais gente as daria, mais valem.</li><li>Tens <b>3 erros</b> por pergunta.</li><li><b>A dois:</b> a disputa decide quem joga; se esse jogador fizer 3 erros, o outro pode <b>roubar</b> os pontos com uma só resposta.</li><li>As rondas 3 e 4 valem a dobrar e a triplicar.</li></ol><p class="note">Os pontos são estimativas nossas do que o povo diria, não vêm de um inquérito real.</p><button class="btn" type="button" data-a="close">Percebi</button></div>`);
/* ---------- som ---------- */
let AC=null,muted=store.get("pp-mute")==="1";
function unlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume()}catch(e){}}
function tone(f,d,o={}){if(muted||!AC||AC.state!=="running")return;const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain();os.type=o.type||"triangle";os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);g.gain.setValueAtTime(o.v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g).connect(AC.destination);os.start(t);os.stop(t+d+.02)}
const SFX={ding:()=>{tone(988,.12,{type:"square",v:.04});tone(1319,.25,{type:"square",v:.04,at:.1})},x:()=>{tone(130,.45,{type:"sawtooth",v:.08});tone(98,.45,{type:"square",v:.05})},dup:()=>tone(440,.12),
  round:()=>[523,659,784].forEach((f,i)=>tone(f,.12,{at:i*.09,type:"square",v:.035})),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,{at:i*.1,type:"square",v:.04}))};
const sfx=k=>{unlock();try{SFX[k]()}catch(e){}};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function setMute(m){muted=m;store.set("pp-mute",m?"1":"0");$("mute").textContent=m?"🔇":"🔊";$("mute").setAttribute("aria-pressed",String(!m))}
function setTheme(t,sv){if(t==="light")document.documentElement.dataset.ppTheme="light";else delete document.documentElement.dataset.ppTheme;if(sv)store.set("pp-tema",t);const tb=$("themeBtn");tb.textContent=t==="light"?"☾":"☀";tb.title=t==="light"?"Tema escuro":"Tema claro"}
let WL=null;
async function keepAwake(on){try{if(on&&!WL&&navigator.wakeLock&&!document.hidden){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}else if(!on&&WL){const w=WL;WL=null;await w.release()}}catch(e){}}
$("mute").addEventListener("click",()=>{setMute(!muted);unlock()});
$("themeBtn").addEventListener("click",()=>setTheme(document.documentElement.dataset.ppTheme==="light"?"dark":"light",true));
setTheme(document.documentElement.dataset.ppTheme==="light"?"light":"dark");setMute(muted);
show("menu");menuInfo();

</script>
<script>/* ===== Ecrã completo (menu e todos os jogos) =====
   O navegador sai do ecrã completo sempre que muda de página. Para não sair ao andar entre jogos,
   quando se está em ecrã completo os links do site abrem por cima, numa moldura (iframe) que ocupa o ecrã todo:
   a página de fora nunca muda e o ecrã completo mantém-se. O endereço e o botão "voltar" continuam a funcionar.
   A escolha fica guardada; se mesmo assim se mudar de página, volta a entrar no primeiro toque. */
(function(){
  const TOP=(()=>{try{return window.top!==window&&window.top.JFS&&window.top.JFS.shell?window.top:null}catch(e){return null}})();
  const D=TOP?TOP.document:document,de=D.documentElement;
  const can=!!(D.fullscreenEnabled||D.webkitFullscreenEnabled);
  const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
  /* app instalada em ecrã completo: já está tudo no ecrã, o botão não faz falta */
  const APPFS=matchMedia("(display-mode: fullscreen)").matches;
  /* app instalada que ainda abre com as barras (o Chrome demora a atualizar a app): entra em ecrã completo no primeiro toque,
     sempre que se abre a app (a escolha de sair só dura até fechar a app) */
  const APPSA=!APPFS&&(matchMedia("(display-mode: standalone)").matches||navigator.standalone===true);
  const get=()=>{if(APPFS)return false;try{if(APPSA){const v=sessionStorage.getItem("pp-fs-app");return v!=="0"}return localStorage.getItem("pp-fs")==="1"}catch(e){return APPSA}};
  const set=v=>{try{if(APPSA)sessionStorage.setItem("pp-fs-app",v?"1":"0");else localStorage.setItem("pp-fs",v?"1":"0")}catch(e){}};
  const enter=()=>{try{const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)return p.catch(()=>{});return Promise.resolve()}catch(e){return Promise.resolve()}};
  const leave=()=>{try{if(!isFs())return;const p=(D.exitFullscreen||D.webkitExitFullscreen).call(D);if(p&&p.catch)p.catch(()=>{})}catch(e){}};
  const JFS={can,isFs,wanted:get,enter,leave,framed:!!TOP};
  window.JFS=JFS;
  /* rodar o ecrã: dentro da moldura tem de ser a página de fora a pedir */
  JFS.lockOr=o=>{const sc=(TOP||window).screen;return sc.orientation&&sc.orientation.lock?sc.orientation.lock(o):Promise.reject()};
  JFS.unlockOr=()=>{try{const sc=(TOP||window).screen;sc.orientation&&sc.orientation.unlock&&sc.orientation.unlock()}catch(e){}};
  /* ir para o menu (passa pela moldura se for caso disso) */
  JFS.home=()=>{const a=document.createElement("a");a.href=new URL("../",location.href).href;a.style.display="none";document.body.appendChild(a);a.click();a.remove()};

  /* ---- links do site ---- */
  const sameSite=a=>{
    if(!a||a.target&&a.target!=="_self"||a.hasAttribute("download"))return null;
    let u;try{u=new URL(a.href,location.href)}catch(e){return null}
    if(u.origin!==location.origin)return null;
    if(u.href.split("#")[0]===location.href.split("#")[0])return null; /* só muda o # */
    return u.href;
  };
  if(TOP){
    /* dentro da moldura: os links vão para a página de fora tratar */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();TOP.JFS.go(h)},false);
  }else{
    JFS.shell=true;
    const HOME=location.href.split("#")[0],baseTitle=document.title;let fr=null,bk=null,syncT=0;
    /* a zona da câmara e da barra de baixo fica com a mesma cor e padrão do jogo que está aberto */
    const meta=document.querySelector('meta[name="theme-color"]');
    const sync=()=>{try{const d=fr.contentDocument;if(!d||!d.body)return;const pl=d.getElementById("play");const el=pl&&!pl.hidden?pl:d.body;const cs=getComputedStyle(el);let bg=cs.backgroundColor;if(el===d.body&&(bg==="rgba(0, 0, 0, 0)"||bg==="transparent"))bg=getComputedStyle(d.documentElement).backgroundColor;
      bk.style.backgroundColor=bg;bk.style.backgroundImage=cs.backgroundImage;bk.style.backgroundSize=cs.backgroundSize;if(meta)meta.content=bg}catch(e){}};
    const close=()=>{if(!fr)return;clearInterval(syncT);fr.remove();fr=null;if(bk){bk.remove();bk=null}document.documentElement.style.overflow="";document.title=baseTitle};
    const show=href=>{
      if(href.split("#")[0]===HOME){close();return}
      if(!fr){
        fr=document.createElement("iframe");fr.id="jfsFrame";fr.title="Jogo";
        fr.allow="fullscreen; web-share; clipboard-write; accelerometer; gyroscope; autoplay; screen-wake-lock";fr.setAttribute("allowfullscreen","");
        /* dentro de uma moldura o env(safe-area-inset-*) vale 0, por isso é a moldura que fica fora da câmara e dos cantos */fr.style.cssText="position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg,#f4eee3)";bk=document.createElement("div");bk.style.cssText="position:fixed;inset:0;z-index:2147483000;background:var(--bg,#f4eee3)";document.body.appendChild(bk);
        fr.src=href;bk.appendChild(fr);document.documentElement.style.overflow="hidden";
        fr.addEventListener("load",()=>{try{document.title=fr.contentDocument.title}catch(e){}sync()});syncT=setInterval(sync,300);
      }else{try{fr.contentWindow.location.replace(href)}catch(e){fr.src=href}}
    };
    JFS.go=href=>{
      const st=history.state&&history.state.jf?history.state:null;
      if(href.split("#")[0]===HOME){if(st&&st.i>0)history.go(-st.i);else close();return}
      const i=(st?st.i:0)+1;
      history.pushState({jf:href,i},"",href);show(href);
    };
    addEventListener("popstate",e=>{const s=e.state;if(s&&s.jf)show(s.jf);else close()});
    if(history.state&&history.state.jf)history.replaceState(null,"",HOME);
    /* jogo aberto diretamente (atalho, link de convite): o botão "voltar" do telemóvel leva ao menu em vez de sair do site */
    if(!document.querySelector("nav.games")&&document.querySelector('a[href="../"]')){
      const HUB=new URL("../",location.href).href,ref=(document.referrer||"").split("#")[0];
      if(ref!==HUB&&!(history.state&&history.state.jg)){const here=location.href;try{history.replaceState({jhub:1},"",HUB);history.pushState({jg:1},"",here)}catch(e){}}
      addEventListener("popstate",e=>{if(e.state&&e.state.jhub)location.replace(HUB)});
    }
    /* em ecrã completo, os links do site abrem na moldura */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;if(!isFs()&&!fr&&!get())return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();JFS.go(h)},false);
  }
  if(!can||APPFS)return;

  /* ---- botão ---- */
  const IN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  let btn=document.getElementById("fsBtn");
  if(btn){const c=btn.cloneNode(false);c.removeAttribute("aria-pressed");btn.replaceWith(c);btn=c} /* a Panela tinha o seu; passa a usar este */
  else{
    const tools=document.querySelector("header .tools");if(!tools)return;
    btn=document.createElement("button");btn.className="btn ghost sm ico";btn.id="fsBtn";btn.type="button";
    const tb=document.getElementById("themeBtn");tools.insertBefore(btn,tb||null);
  }
  const st=document.createElement("style");
  st.textContent="#fsBtn{display:inline-grid;place-items:center}#fsBtn[hidden]{display:none}#fsBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}";
  document.head.appendChild(st);
  const upd=()=>{const f=isFs();btn.innerHTML=f?OUT:IN;btn.title=f?"Sair do ecrã completo":"Ecrã completo";btn.setAttribute("aria-label",btn.title);if(window.dispatchEvent)setTimeout(()=>dispatchEvent(new Event("resize")),250)};
  upd();D.addEventListener("fullscreenchange",upd);D.addEventListener("webkitfullscreenchange",upd);
  btn.hidden=false;
  btn.addEventListener("click",()=>{const f=isFs();set(!f);f?leave():enter()});
  if(TOP)return;
  /* guardar a escolha */
  let leaving=false;addEventListener("pagehide",()=>{leaving=true});
  const onChange=()=>{if(!isFs()&&!leaving&&document.visibilityState==="visible")set(false)};
  document.addEventListener("fullscreenchange",onChange);document.addEventListener("webkitfullscreenchange",onChange);
  /* se mesmo assim mudou de página: volta a entrar no primeiro toque */
  if(get()&&!isFs()){
    const off=()=>{removeEventListener("click",once,true);removeEventListener("touchend",once,true)};
    const once=e=>{if(e.target&&e.target.closest&&e.target.closest("#fsBtn"))return;off();if(!isFs())enter()};
    addEventListener("click",once,true);addEventListener("touchend",once,true);
  }
})();
</script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}))</script></body>
