<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Apanha o <span>Elétrico</span></h1><a class="home" id="hubLink" href="../">← mais jogos</a></div>
    <div class="tools">
      <button class="btn ghost sm ico" id="mute" type="button" aria-pressed="true" aria-label="Som" title="Som">🔊</button>
      <button class="btn ghost sm ico" id="themeBtn" type="button" aria-label="Tema escuro" title="Tema escuro">☾</button>
    </div>
  </header>
  <main class="stage" id="stage" aria-label="Jogo: corre pelos carris e foge do revisor">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud" hidden>
      <span class="hcoins">🪙 <span id="hCoins">0</span></span>
      <div class="hdist"><b id="hDist">0 m</b><small id="hBest"></small></div>
      <button class="pbtn" id="pauseBtn" type="button" aria-label="Pausa">❚❚</button>
    </div>
    <div class="hpw" id="hPw"></div>
    <div class="hmsg" id="hMsg" hidden></div>
    <div class="ov" id="ov"></div>
  </main>
  <p class="foot">Desliza o dedo: ← → muda de linha, ↑ salta, ↓ rebola (ou usa as setas).</p>
</div>
<script>

/* ================= APANHA O ELÉTRICO (corrida sem fim, offline) =================
   Mundo em metros: x para o lado (3 linhas), y para cima, z para a frente. Câmara atrás do jogador em perspetiva simples
   (cada ponto é dividido pela distância). Obstáculos em filas; em cada fila há sempre uma "linha segura" e a seguinte
   fica ao lado ou na mesma, por isso há sempre caminho. */
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage");
/* ---------- progresso ---------- */

stage.addEventListener("touchmove",e=>{if(G&&G.state==="play")e.preventDefault()},{passive:false});
const KEYS={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",ArrowUp:"up",w:"up",W:"up"," ":"up",ArrowDown:"down",s:"down",S:"down"};
document.addEventListener("keydown",e=>{if(e.repeat)return;if(KEYS[e.key]&&G&&G.state==="play"){e.preventDefault();unlock();act(KEYS[e.key])}if(e.key==="Escape"||e.key==="p")pause();if(e.key==="Enter"&&G&&G.state!=="play"&&G.state!=="dead"&&!ov.hidden&&ov.querySelector('[data-a="go"]'))start()});
$("pauseBtn").onclick=pause;
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(layout,60)});
$("mute").addEventListener("click",()=>{setMute(!muted);unlock()});
$("themeBtn").addEventListener("click",()=>setTheme(document.documentElement.dataset.ppTheme==="light"?"dark":"light",true));
setTheme(document.documentElement.dataset.ppTheme==="light"?"light":"dark");setMute(muted);
layout();menu();requestAnimationFrame(t=>{last=t;loop(t)});

</script>
<script>/* ===== Ecrã completo (menu e todos os jogos) =====
   O navegador sai do ecrã completo sempre que muda de página. Para não sair ao andar entre jogos,
   quando se está em ecrã completo os links do site abrem por cima, numa moldura (iframe) que ocupa o ecrã todo:
   a página de fora nunca muda e o ecrã completo mantém-se. O endereço e o botão "voltar" continuam a funcionar.
   A escolha fica guardada; se mesmo assim se mudar de página, volta a entrar no primeiro toque. */
(function(){
  const TOP=(()=>{try{return window.top!==window&&window.top.JFS&&window.top.JFS.shell?window.top:null}catch(e){return null}})();
  const D=TOP?TOP.document:document,de=D.documentElement;
  const can=!!(D.fullscreenEnabled||D.webkitFullscreenEnabled);
  const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
  /* app instalada em ecrã completo: já está tudo no ecrã, o botão não faz falta */
  const APPFS=matchMedia("(display-mode: fullscreen)").matches;
  const get=()=>{if(APPFS)return false;try{return localStorage.getItem("pp-fs")==="1"}catch(e){return false}};
  const set=v=>{try{localStorage.setItem("pp-fs",v?"1":"0")}catch(e){}};
  const enter=()=>{try{const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)return p.catch(()=>{});return Promise.resolve()}catch(e){return Promise.resolve()}};
  const leave=()=>{try{if(!isFs())return;const p=(D.exitFullscreen||D.webkitExitFullscreen).call(D);if(p&&p.catch)p.catch(()=>{})}catch(e){}};
  const JFS={can,isFs,wanted:get,enter,leave,framed:!!TOP};
  window.JFS=JFS;
  /* rodar o ecrã: dentro da moldura tem de ser a página de fora a pedir */
  JFS.lockOr=o=>{const sc=(TOP||window).screen;return sc.orientation&&sc.orientation.lock?sc.orientation.lock(o):Promise.reject()};
  JFS.unlockOr=()=>{try{const sc=(TOP||window).screen;sc.orientation&&sc.orientation.unlock&&sc.orientation.unlock()}catch(e){}};
  /* ir para o menu (passa pela moldura se for caso disso) */
  JFS.home=()=>{const a=document.createElement("a");a.href=new URL("../",location.href).href;a.style.display="none";document.body.appendChild(a);a.click();a.remove()};

  /* ---- links do site ---- */
  const sameSite=a=>{
    if(!a||a.target&&a.target!=="_self"||a.hasAttribute("download"))return null;
    let u;try{u=new URL(a.href,location.href)}catch(e){return null}
    if(u.origin!==location.origin)return null;
    if(u.href.split("#")[0]===location.href.split("#")[0])return null; /* só muda o # */
    return u.href;
  };
  if(TOP){
    /* dentro da moldura: os links vão para a página de fora tratar */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();TOP.JFS.go(h)},false);
  }else{
    JFS.shell=true;
    const HOME=location.href.split("#")[0],baseTitle=document.title;let fr=null,bk=null,syncT=0;
    /* a zona da câmara e da barra de baixo fica com a mesma cor e padrão do jogo que está aberto */
    const meta=document.querySelector('meta[name="theme-color"]');
    const sync=()=>{try{const d=fr.contentDocument;if(!d||!d.body)return;const pl=d.getElementById("play");const el=pl&&!pl.hidden?pl:d.body;const cs=getComputedStyle(el);let bg=cs.backgroundColor;if(el===d.body&&(bg==="rgba(0, 0, 0, 0)"||bg==="transparent"))bg=getComputedStyle(d.documentElement).backgroundColor;
      bk.style.backgroundColor=bg;bk.style.backgroundImage=cs.backgroundImage;bk.style.backgroundSize=cs.backgroundSize;if(meta)meta.content=bg}catch(e){}};
    const close=()=>{if(!fr)return;clearInterval(syncT);fr.remove();fr=null;if(bk){bk.remove();bk=null}document.documentElement.style.overflow="";document.title=baseTitle};
    const show=href=>{
      if(href.split("#")[0]===HOME){close();return}
      if(!fr){
        fr=document.createElement("iframe");fr.id="jfsFrame";fr.title="Jogo";
        fr.allow="fullscreen; web-share; clipboard-write; accelerometer; gyroscope; autoplay; screen-wake-lock";fr.setAttribute("allowfullscreen","");
        /* dentro de uma moldura o env(safe-area-inset-*) vale 0, por isso é a moldura que fica fora da câmara e dos cantos */fr.style.cssText="position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg,#f4eee3)";bk=document.createElement("div");bk.style.cssText="position:fixed;inset:0;z-index:2147483000;background:var(--bg,#f4eee3)";document.body.appendChild(bk);
        fr.src=href;bk.appendChild(fr);document.documentElement.style.overflow="hidden";
        fr.addEventListener("load",()=>{try{document.title=fr.contentDocument.title}catch(e){}sync()});syncT=setInterval(sync,300);
      }else{try{fr.contentWindow.location.replace(href)}catch(e){fr.src=href}}
    };
    JFS.go=href=>{
      const st=history.state&&history.state.jf?history.state:null;
      if(href.split("#")[0]===HOME){if(st&&st.i>0)history.go(-st.i);else close();return}
      const i=(st?st.i:0)+1;
      history.pushState({jf:href,i},"",href);show(href);
    };
    addEventListener("popstate",e=>{const s=e.state;if(s&&s.jf)show(s.jf);else close()});
    if(history.state&&history.state.jf)history.replaceState(null,"",HOME);
    /* jogo aberto diretamente (atalho, link de convite): o botão "voltar" do telemóvel leva ao menu em vez de sair do site */
    if(!document.querySelector("nav.games")&&document.querySelector('a[href="../"]')){
      const HUB=new URL("../",location.href).href,ref=(document.referrer||"").split("#")[0];
      if(ref!==HUB&&!(history.state&&history.state.jg)){const here=location.href;try{history.replaceState({jhub:1},"",HUB);history.pushState({jg:1},"",here)}catch(e){}}
      addEventListener("popstate",e=>{if(e.state&&e.state.jhub)location.replace(HUB)});
    }
    /* em ecrã completo, os links do site abrem na moldura */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;if(!isFs()&&!fr&&!get())return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();JFS.go(h)},false);
  }
  if(!can||APPFS)return;

  /* ---- botão ---- */
  const IN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  let btn=document.getElementById("fsBtn");
  if(btn){const c=btn.cloneNode(false);c.removeAttribute("aria-pressed");btn.replaceWith(c);btn=c} /* a Panela tinha o seu; passa a usar este */
  else{
    const tools=document.querySelector("header .tools");if(!tools)return;
    btn=document.createElement("button");btn.className="btn ghost sm ico";btn.id="fsBtn";btn.type="button";
    const tb=document.getElementById("themeBtn");tools.insertBefore(btn,tb||null);
  }
  const st=document.createElement("style");
  st.textContent="#fsBtn{display:inline-grid;place-items:center}#fsBtn[hidden]{display:none}#fsBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}";
  document.head.appendChild(st);
  const upd=()=>{const f=isFs();btn.innerHTML=f?OUT:IN;btn.title=f?"Sair do ecrã completo":"Ecrã completo";btn.setAttribute("aria-label",btn.title);if(window.dispatchEvent)setTimeout(()=>dispatchEvent(new Event("resize")),250)};
  upd();D.addEventListener("fullscreenchange",upd);D.addEventListener("webkitfullscreenchange",upd);
  btn.hidden=false;
  btn.addEventListener("click",()=>{const f=isFs();set(!f);f?leave():enter()});
  if(TOP)return;
  /* guardar a escolha */
  let leaving=false;addEventListener("pagehide",()=>{leaving=true});
  const onChange=()=>{if(!isFs()&&!leaving&&document.visibilityState==="visible")set(false)};
  document.addEventListener("fullscreenchange",onChange);document.addEventListener("webkitfullscreenchange",onChange);
  /* se mesmo assim mudou de página: volta a entrar no primeiro toque */
  if(get()&&!isFs()){
    const off=()=>{removeEventListener("click",once,true);removeEventListener("touchend",once,true)};
    const once=e=>{if(e.target&&e.target.closest&&e.target.closest("#fsBtn"))return;off();if(!isFs())enter()};
    addEventListener("click",once,true);addEventListener("touchend",once,true);
  }
})();
</script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}))</script></body>
