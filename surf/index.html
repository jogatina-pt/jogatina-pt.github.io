/* ipgames: base comum (mesma família visual da Panela de Pressão) */
@font-face{font-family:"Bowlby One";font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/bowlby-one.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(../fonts/figtree.woff2) format("woff2")}
[hidden]{display:none!important}
:root{
  --bg:#000000; --surface:#171717; --surface-2:#232323; --line:#363636;
  --ink:#eef2ea; --muted:#aaaaaa; --title:#f1ece2; --enamel:#f1ece2; --card-ink:#1b2422;
  --accent:#ff8a3d; --accent-ink:#1d130b; --steam:#8fd3c8; --danger:#ff5a4f; --good:#5fd08a;
  --display:"Bowlby One", Impact, "Arial Black", sans-serif;

  color-scheme:dark;
}
:root[data-pp-theme="light"]{
  --bg:#f4eee3; --surface:#fffaf1; --surface-2:#ebe1cf; --line:#d8cab2;
  --ink:#1f2a28; --muted:#5b6965; --title:#1f2a28; --enamel:#fffdf8; --card-ink:#1b2422;
  --accent:#e8731f; --steam:#1d7a6e; --danger:#c8352b; --good:#1f8a4c;
  color-scheme:light;
}
html,body{margin:0}
html{height:100%}
html,body{background:var(--bg);color:var(--ink)}
body{min-height:100%;box-sizing:border-box;overflow-x:hidden;font-family:var(--body);font-size:15px;line-height:1.45;padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column}
.wrap{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--steam);outline-offset:2px}
a{color:inherit}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 20px;font-weight:800;font-size:15px;text-decoration:none;line-height:1.1}
.btn:disabled{opacity:.4;cursor:default}

header.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;flex:none}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:clamp(24px,6vw,34px);line-height:1;color:var(--title)}
.brand h1 span{color:var(--accent)}
.brand a.home{font-size:13px;color:var(--muted);text-decoration:none;font-weight:700;white-space:nowrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;box-sizing:border-box;min-width:0}
input:focus,input:focus-visible{outline:none;border-color:var(--steam);box-shadow:inset 0 0 0 1.5px var(--steam)}
.setup{display:flex;flex-direction:column;gap:16px;align-items:flex-start;flex:1;padding-block:12px 24px}

.setup h2 span{color:var(--accent);display:block}
.setup p{max-width:58ch;color:var(--muted);margin:0}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;width:100%;max-width:360px}
.mode{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px;box-sizing:border-box}
.join{display:flex;gap:8px}
.join input{text-transform:uppercase;letter-spacing:.2em;font-weight:800;flex:1}
.join.fromlink input{border-color:var(--accent)}
.note{font-size:13.5px;color:var(--steam);margin:0;min-height:1.2em}

.lobby .code{font-size:clamp(44px,14vw,80px);letter-spacing:.12em;color:var(--accent)}
.roster{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
.roster li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-height:24px}

.linkbtn{background:none;border:0;padding:4px 2px;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.foot{font-size:13px;color:var(--muted);margin:4px 0 0}
.modal{position:fixed;inset:0;background:rgba(8,14,13,.72);display:grid;place-items:center;padding:16px;z-index:33;box-sizing:border-box}
.sheet{box-sizing:border-box;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px;max-width:460px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:24px;color:var(--title)}
.sheet .body{color:var(--muted)}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap}
.sheet ul{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px}
.sheet li b{color:var(--ink)}
.alert{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);width:max-content;box-sizing:border-box;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;padding:12px 16px;border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.3);text-align:center;pointer-events:none}
.alert.show{animation:alertin .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes alertin{from{transform:translate(-50%,-20px) scale(.9);opacity:0}to{transform:translateX(-50%);opacity:1}}
.bubble{position:fixed;transform:translate(-50%,-100%);font-size:30px;pointer-events:none;animation:bub 2.6s ease forwards;z-index:26}
@keyframes bub{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.1)}20%{transform:translate(-50%,-100%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%)}}
.reacts{position:fixed;z-index:35;display:grid;grid-template-columns:repeat(3,auto);gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.reacts button{font-size:24px;background:var(--surface-2);border:0;border-radius:10px;padding:4px 9px}
@media (prefers-reduced-motion:reduce){.alert.show,.bubble{animation:none}}
.roster li.free.more{border:0!important;background:transparent;padding:2px 6px;min-height:0;font-size:13px}

/* ===== Estilo banda desenhada (comum a todos os jogos) ===== */
@font-face{font-family:"Bangers";font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/bangers.woff2) format("woff2")}
:root{--display:"Bangers","Bowlby One",Impact,sans-serif;--stroke:#151515;--pop:#ffd23f;--pop-ink:#151515;
  --dots:radial-gradient(rgba(21,21,21,.09) 1.3px,transparent 1.6px)}

body{background-image:var(--dots);background-size:13px 13px}
h1,h2,h3{font-family:var(--display);letter-spacing:.03em;font-weight:400}

.btn{border:3px solid var(--stroke)!important;box-shadow:3px 3px 0 var(--stroke);font-family:var(--display);font-size:19px;letter-spacing:.06em;font-weight:400;padding:9px 20px;transition:transform .08s,box-shadow .08s}

.mode,.roster li,.sheet,.qcard,.bcard,.wordcard,.mucard,.rstep,.board li,.opt,.sub,.wcard,.sent,.jbox,.yourturn,.outbox,.words p,.roles li,.others li,.tally li,.drink,.yn2 p,.rulebar,.vol li,.chips li,.seg button,.age,.foreheads li{border:3px solid var(--stroke)!important;box-shadow:4px 4px 0 var(--stroke)}

.lobby .code{-webkit-text-stroke:2px var(--stroke);text-shadow:4px 4px 0 var(--stroke);letter-spacing:.14em}

.eyebrow{letter-spacing:.12em}

.setup .mascot{width:min(42vw,170px);height:auto;align-self:flex-end;margin:-8px 0 -18px;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.12))}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;width:100%}
.bubble-say{position:relative;background:#fff;color:#151515;border:3px solid #151515;border-radius:18px;padding:8px 12px;font-family:var(--display);font-size:20px;letter-spacing:.04em;box-shadow:3px 3px 0 #151515;max-width:16ch}

/* janelas dos jogos de arcada (pausa, fim, menus) também escuras no modo escuro */

:root,:root[data-pp-theme="light"]{--accent:#d23a6e;--accent-ink:#fff}
:root:not([data-pp-theme="light"]){--accent:#ff8fc0;--accent-ink:#2a0516}
html,body{height:100%}
body{padding-bottom:max(8px,env(safe-area-inset-bottom,0px));overflow:hidden}
.wrap{max-width:1100px;gap:8px;min-height:0;flex:1;display:flex;flex-direction:column}

<script type="module">
import * as THREE from "../lib/three.module.min.js";
/* ================= SURFA! — surf de rampas =================
   O movimento segue as regras do motor Source (as dos servidores de surf):
   - 100 "ticks" por segundo, gravidade 800, aceleração no ar 150 com limite de 30 por tick de desejo (é o que dá o strafe)
   - rampas com mais de ~45° não contam como chão: a bola/jogador está "no ar" em cima delas e a velocidade é projetada no plano
   - o jogador é uma caixa de 32×32×72 unidades; o mapa são "brushes" convexos (caixas e prismas), como nos mapas a sério.
   O desenho é three.js; 32 unidades do jogo = 1 unidade 3D. */
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const TOUCH=matchMedia("(pointer: coarse)").matches||"ontouchstart" in window;
const SET=Object.assign({assist:TOUCH,sens:.3,msens:2,fov:100,music:true},(()=>{try{return JSON.parse(store.get("surf-set")||"{}")}catch(e){return{}}})());
const saveSet=()=>store.set("surf-set",JSON.stringify(SET));
/* ---------- física ---------- */
const TICK=1/100,GRAV=800,AIRACC=150,ACC=10,FRIC=4,STOPSPD=75,MAXSPD=250,AIRCAP=30,MAXVEL=3500,JUMPV=Math.sqrt(2*800*57);
const HX=16,HY=16,HZ=36,EYE=28,EPS=.03125,ANG=52*Math.PI/180;
const BRUSH=[];
function addBrush(planes,min,max,vis){

  const b={planes:planes.map(p=>[p[0],p[1],p[2],p[3]+HX*Math.abs(p[0])+HY*Math.abs(p[1])+HZ*Math.abs(p[2])]),min,max,vis};BRUSH.push(b);return b}
const IGNP=new Set();const TR={frac:1,n:null,start:false,all:false,end:[0,0,0]};
function trace(sx,sy,sz,ex,ey,ez){
  let frac=1,hn=null,hb=null,start=false,all=false;
  const lx=Math.min(sx,ex)-HX-1,hx=Math.max(sx,ex)+HX+1,ly=Math.min(sy,ey)-HY-1,hy=Math.max(sy,ey)+HY+1,lz=Math.min(sz,ez)-HZ-1,hz=Math.max(sz,ez)+HZ+1;

    if(b.max[0]<lx||b.min[0]>hx||b.max[1]<ly||b.min[1]>hy||b.max[2]<lz||b.min[2]>hz)continue;
    let enter=-1,leave=1,bn=null,so=false,eo=false,out=false;
    for(const p of b.planes){
      if(IGNP.has(p))continue;

      if(d1<=0&&d2<=0)continue;

    }

const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function clip(i,n,o){const bo=dot(i,n);o[0]=i[0]-n[0]*bo;o[1]=i[1]-n[1]*bo;o[2]=i[2]-n[2]*bo;const ad=dot(o,n);if(ad<0){o[0]-=n[0]*ad;o[1]-=n[1]*ad;o[2]-=n[2]*ad}}

    if(Math.abs(n[2])<.05||n[2]>=.7){const hit=-dot(v,n);if(hit>350){P.bonk=Math.max(P.bonk||0,hit);if(ZC.bl&&ZC.bl.length<40)ZC.bl.push([n.map(x=>+x.toFixed(2)),Math.round(hit),Math.round(Math.hypot(v[0],v[1])),p.map(Math.round)])}}

function categorize(P){if(P.v[2]>140){P.ground=false;return}const p=P.p,t=trace(p[0],p[1],p[2],p[0],p[1],p[2]-2);

function unstick(P){const p=P.p;for(let r=1;r<=24;r+=1)for(const [dx,dy,dz] of [[0,0,1],[0,0,-1],[1,0,0],[-1,0,0],[0,1,0],[0,-1,0]]){const x=p[0]+dx*r,y=p[1]+dy*r,z=p[2]+dz*r;if(!trace(x,y,z,x,y,z).start){p[0]=x;p[1]=y;p[2]=z;return}}}

/* ---------- comandos (teclado, rato e ecrã) ---------- */
const IN={w:0,s:0,a:0,d:0,j:0};
function tick(){
  const P=G.P;P.ticks++;const yawD=P.yaw-P.lyaw;P.lyaw=P.yaw;

    if(P.ticks-P.rampT<4){const d=Math.sin(P.yaw)*P.rampN[0]-Math.cos(P.yaw)*P.rampN[1];if(Math.abs(d)>.04)side=d<0?1:-1}
    else if(Math.abs(yawD)>.0004){side=yawD<0?1:-1;P.hs=side;P.hsT=P.ticks}
    else if(P.hs&&P.ticks-P.hsT<35)side=P.hs} /* ao tirar o dedo do ecrã, mantém o último strafe uns 0,35 s para não perderes velocidade */

  else{v[2]-=GRAV*TICK*.5;accel(v,wd,ws,AIRACC,true);const sp0=Math.hypot(v[0],v[1],v[2]),pp=P.p.slice(),onr=P.ticks-P.rampT<3;tryMove(P);const sp1=Math.hypot(v[0],v[1],v[2]);if(onr&&sp0>400&&sp1<sp0*.7&&ZC.dr&&ZC.dr.length<30)ZC.dr.push([Math.round(sp0),Math.round(sp1),pp.map(Math.round),P.v0.map(Math.round),P.dbg.map(n=>n.map(x=>+x.toFixed(2))),(P.hn||[]).map(x=>+x.toFixed(2)),P.hb&&P.hb.tag&&[P.hb.tag.A.map(q=>q.map(Math.round)),P.hb.tag.B.map(q=>q.map(Math.round)),P.hb.planes.length],P.stuck?1:0,+(P.ticks/100).toFixed(1)]);v[2]-=GRAV*TICK*.5}

}
/* ---------- mapas (cada um com vários stages) ---------- */
const MAPS=[];let CUR=null,CURM=null,STAGES=[];
function map(id,name,lvl,theme,fn){CURM={id,name,lvl,theme,stages:[]};fn();MAPS.push(CURM)}
const inZone=(p,z)=>p[0]>z[0]&&p[0]<z[1]&&p[1]>z[2]&&p[1]<z[3]&&p[2]>z[4]&&p[2]<z[5];
function stage(name,ox,col,fn,o){const s=Object.assign({name,ox,col,vis:[],map:CURM},o||{});CUR=s;fn(s);CURM.stages.push(s)}
function plat(x0,x1,y0,y1,z0,z1,kind){const o=CUR.ox;CUR.vis.push(addBrush([],[x0+o,y0,z0],[x1+o,y1,z1],{t:"box",kind}).vis);}
function rY(xr,y0,y1,zt,h,side=0,ang){const A=ang?ang*Math.PI/180:ANG;const o=CUR.ox;xr+=o;const run=h/Math.tan(A),sa=Math.sin(A),ca=Math.cos(A),zb=zt-h,pl=[];
  pl.push(side<=0?[-sa,0,ca,-sa*xr+ca*zt]:[-1,0,0,-xr]);pl.push(side>=0?[sa,0,ca,sa*xr+ca*zt]:[1,0,0,xr]);pl.push([0,0,-1,-zb],[0,-1,0,-y0],[0,1,0,y1]);
  addBrush(pl,[side<=0?xr-run:xr,y0,zb],[side>=0?xr+run:xr,y1,zt]);CUR.vis.push({t:"rY",xr,y0,y1,zt,zb,run,side,pts:[[xr,y0],[xr,y1]]})}
function rX(yr,x0,x1,zt,h,side=0,ang){const A=ang?ang*Math.PI/180:ANG;const o=CUR.ox;x0+=o;x1+=o;const run=h/Math.tan(A),sa=Math.sin(A),ca=Math.cos(A),zb=zt-h,pl=[];
  pl.push(side<=0?[0,-sa,ca,-sa*yr+ca*zt]:[0,-1,0,-yr]);pl.push(side>=0?[0,sa,ca,sa*yr+ca*zt]:[0,1,0,yr]);pl.push([0,0,-1,-zb],[-1,0,0,-x0],[1,0,0,x1]);
  addBrush(pl,[x0,side<=0?yr-run:yr,zb],[x1,side>=0?yr+run:yr,zt]);CUR.vis.push({t:"rX",yr,x0,x1,zt,zb,run,side,pts:[[x0,yr],[x1,yr]]})}

/* brush convexo qualquer, com os "bevels" todos (planos extra nas arestas) para a caixa do jogador não prender nas juntas */
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

/* rampa contínua feita de troços retos ("S",comprimento) e curvas ("C",raio,graus,+1 esquerda/-1 direita); a crista fica sempre à mesma altura */
function course(x,y,dir,zt,h,ang,pieces){const o=CUR.ox;x+=o;dir*=Math.PI/180;const run=h/Math.tan(ang*Math.PI/180),zb=zt-h,pts=[[x,y]],segs=[];let s=0;

/* ---------- música de fundo: chill beats gerados na hora (sem ficheiros) ---------- */
const MUS={g:null,next:0,step:0,t:0,nb:null};
const MCH=[[57,60,64,67,71],[53,57,60,64,67],[48,52,55,59,62],[55,59,62,64,69]],MBS=[45,41,48,43],mf=m=>440*Math.pow(2,(m-69)/12);
function musicBus(){return MUS.g||(()=>{const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=5200;g.gain.value=0;g.connect(lp).connect(AC.destination);MUS.g=g;
  const n=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MUS.nb=n;return g})()}
function mNote(t,f,d,v,type,lp){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type="lowpass";fl.frequency.value=lp;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl).connect(g).connect(musicBus());o.start(t);o.stop(t+d+.05)}
function mNoise(t,d,v,ft,fq){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=MUS.nb;f.type=ft;f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(musicBus());s.start(t,Math.random()*.5);s.stop(t+d+.02)}
function musicStep(t,k){const bar=Math.floor(k/16)%4,st=k%16,sd=60/78/4;
  if(st===0||st===10||st===7&&bar%2){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(musicBus());o.start(t);o.stop(t+.25)}
  if(st===4||st===12){mNoise(t,.16,.2,"bandpass",1900);mNote(t,185,.1,.1,"triangle",900)}
  if(st%2===0)mNoise(t,st===14?.16:.045,st%4===2?.07:.04,"highpass",7500);
  if(st===0){MCH[bar].forEach((m,i)=>{mNote(t+i*.018,mf(m),sd*14,.032,"triangle",1500);mNote(t+i*.018,mf(m)*1.004,sd*14,.022,"sine",2500)})}
  if(st===10&&bar%2===0){MCH[bar].slice(1,4).forEach((m,i)=>mNote(t+i*.02,mf(m+12),sd*3,.018,"sine",3000))}
  if(st===0||st===10||st===6)mNote(t,mf(MBS[bar]),sd*(st===0?5:3),.2,"sine",700)}
function musicTick(){if(!AC||AC.state!=="running")return;const bus=musicBus(),want=(!muted&&SET.music!==false&&!document.hidden)?.5:0;bus.gain.setTargetAtTime(want,AC.currentTime,.3);
  if(!want)return;if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.05;const sd=60/78/4;
  while(MUS.next<AC.currentTime+.3){musicStep(MUS.next+(MUS.step%2?sd*.22:0),MUS.step);MUS.next+=sd;MUS.step++}}
setInterval(()=>{try{musicTick()}catch(e){}},80);
function tone(f,d,o={}){if(muted||!AC||AC.state!=="running")return;const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain();os.type=o.type||"triangle";os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);g.gain.setValueAtTime(o.v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g).connect(AC.destination);os.start(t);os.stop(t+d+.02)}
const SFX={boost:()=>tone(220,.35,{type:"sawtooth",v:.05,f2:880}),jump:()=>tone(300,.08,{type:"sine",v:.04,f2:420}),fall:()=>tone(500,.5,{type:"sawtooth",v:.05,f2:80}),stage:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.14,{at:i*.08,type:"square",v:.045})),land:()=>tone(90,.12,{type:"sine",v:.12,f2:50}),bonk:()=>tone(120,.08,{type:"square",v:.05,f2:60})};
const sfx=k=>{try{SFX[k]()}catch(e){}};
function windUpd(){return;if(!WIND)return;const sp=G&&G.state==="play"?Math.hypot(...G.P.v):0,on=!muted&&sp>60;WIND.g.gain.setTargetAtTime(on?Math.min(.22,sp/9000):0,AC.currentTime,.12);WIND.f.frequency.setTargetAtTime(250+Math.min(2600,sp*1.1),AC.currentTime,.15)}
function setMute(m){muted=m;store.set("pp-mute",m?"1":"0");$("mute").textContent=m?"🔇":"🔊"}
$("mute").addEventListener("click",()=>{setMute(!muted);unlock()});setMute(muted);
function setTheme(t,sv){if(t==="light")document.documentElement.dataset.ppTheme="light";else delete document.documentElement.dataset.ppTheme;if(sv)store.set("pp-tema",t);$("themeBtn").textContent=t==="light"?"☾":"☀"}
$("themeBtn").addEventListener("click",()=>setTheme(document.documentElement.dataset.ppTheme==="light"?"dark":"light",true));setTheme(document.documentElement.dataset.ppTheme==="light"?"light":"dark");
let WL=null;async function keepAwake(on){try{if(on&&!WL&&navigator.wakeLock&&!document.hidden){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}else if(!on&&WL){const w=WL;WL=null;await w.release()}}catch(e){}}
/* ---------- ciclo: física fixa a 100 Hz, desenho interpolado ---------- */
let last=0;
function loop(t){const dt=Math.min(.1,(t-last)/1000||0);last=t;
  if(G&&G.state==="play"){G.acc+=dt;let n=0;while(G.acc>=TICK&&n<12){G.P.prev=G.P.p.slice();tick();G.acc-=TICK;n++;if(G.state!=="play")break}
    if(G.P.land){if(G.P.land>500)sfx("land");G.P.land=0}if(G.P.bonk){sfx("bonk");G.P.bonk=0}}
  if(msgT>0){msgT-=dt;if(msgT<=0)$("hMsg").hidden=true}
  draw(G&&G.state==="play"?Math.min(1,G.acc/TICK):1);hud();windUpd();requestAnimationFrame(loop)}

window.SURF={ZC,get G(){return G},IN,SET,get STAGES(){return STAGES},MAPS,setMap(i){MI=i},tick,start,trace,BRUSH};

<script>/* ===== Ecrã completo (menu e todos os jogos) =====
   O navegador sai do ecrã completo sempre que muda de página. Para não sair ao andar entre jogos,
   quando se está em ecrã completo os links do site abrem por cima, numa moldura (iframe) que ocupa o ecrã todo:
   a página de fora nunca muda e o ecrã completo mantém-se. O endereço e o botão "voltar" continuam a funcionar.
   A escolha fica guardada; se mesmo assim se mudar de página, volta a entrar no primeiro toque. */
(function(){
  const TOP=(()=>{try{return window.top!==window&&window.top.JFS&&window.top.JFS.shell?window.top:null}catch(e){return null}})();
  const D=TOP?TOP.document:document,de=D.documentElement;
  const can=!!(D.fullscreenEnabled||D.webkitFullscreenEnabled);
  const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
  /* app instalada em ecrã completo: já está tudo no ecrã, o botão não faz falta */
  const APPFS=matchMedia("(display-mode: fullscreen)").matches;
  /* app instalada que ainda abre com as barras (o Chrome demora a atualizar a app): entra em ecrã completo no primeiro toque,
     sempre que se abre a app (a escolha de sair só dura até fechar a app) */
  const APPSA=!APPFS&&(matchMedia("(display-mode: standalone)").matches||navigator.standalone===true);
  const get=()=>{if(APPFS)return false;try{if(APPSA){const v=sessionStorage.getItem("pp-fs-app");return v!=="0"}return localStorage.getItem("pp-fs")==="1"}catch(e){return APPSA}};
  const set=v=>{try{if(APPSA)sessionStorage.setItem("pp-fs-app",v?"1":"0");else localStorage.setItem("pp-fs",v?"1":"0")}catch(e){}};
  const enter=()=>{try{const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)return p.catch(()=>{});return Promise.resolve()}catch(e){return Promise.resolve()}};
  const leave=()=>{try{if(!isFs())return;const p=(D.exitFullscreen||D.webkitExitFullscreen).call(D);if(p&&p.catch)p.catch(()=>{})}catch(e){}};
  const JFS={can,isFs,wanted:get,enter,leave,framed:!!TOP};
  window.JFS=JFS;
  /* rodar o ecrã: dentro da moldura tem de ser a página de fora a pedir */
  JFS.lockOr=o=>{const sc=(TOP||window).screen;return sc.orientation&&sc.orientation.lock?sc.orientation.lock(o):Promise.reject()};
  JFS.unlockOr=()=>{try{const sc=(TOP||window).screen;sc.orientation&&sc.orientation.unlock&&sc.orientation.unlock()}catch(e){}};
  /* ir para o menu (passa pela moldura se for caso disso) */
  JFS.home=()=>{const a=document.createElement("a");a.href=new URL("../",location.href).href;a.style.display="none";document.body.appendChild(a);a.click();a.remove()};

  /* ---- links do site ---- */
  const sameSite=a=>{
    if(!a||a.target&&a.target!=="_self"||a.hasAttribute("download"))return null;
    let u;try{u=new URL(a.href,location.href)}catch(e){return null}
    if(u.origin!==location.origin)return null;
    if(u.href.split("#")[0]===location.href.split("#")[0])return null; /* só muda o # */
    return u.href;
  };
  if(TOP){
    /* dentro da moldura: os links vão para a página de fora tratar */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();TOP.JFS.go(h)},false);
  }else{
    JFS.shell=true;
    const HOME=location.href.split("#")[0],baseTitle=document.title;let fr=null,bk=null,syncT=0;
    /* a zona da câmara e da barra de baixo fica com a mesma cor e padrão do jogo que está aberto */
    const meta=document.querySelector('meta[name="theme-color"]');
    const sync=()=>{try{const d=fr.contentDocument;if(!d||!d.body)return;const pl=d.getElementById("play");const el=pl&&!pl.hidden?pl:d.body;const cs=getComputedStyle(el);let bg=cs.backgroundColor;if(el===d.body&&(bg==="rgba(0, 0, 0, 0)"||bg==="transparent"))bg=getComputedStyle(d.documentElement).backgroundColor;
      bk.style.backgroundColor=bg;bk.style.backgroundImage=cs.backgroundImage;bk.style.backgroundSize=cs.backgroundSize;if(meta)meta.content=bg}catch(e){}};
    const close=()=>{if(!fr)return;clearInterval(syncT);fr.remove();fr=null;if(bk){bk.remove();bk=null}document.documentElement.style.overflow="";document.title=baseTitle};
    const show=href=>{
      if(href.split("#")[0]===HOME){close();return}
      if(!fr){
        fr=document.createElement("iframe");fr.id="jfsFrame";fr.title="Jogo";
        fr.allow="fullscreen; web-share; clipboard-write; accelerometer; gyroscope; autoplay; screen-wake-lock";fr.setAttribute("allowfullscreen","");
        /* dentro de uma moldura o env(safe-area-inset-*) vale 0, por isso é a moldura que fica fora da câmara e dos cantos */fr.style.cssText="position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg,#f4eee3)";bk=document.createElement("div");bk.style.cssText="position:fixed;inset:0;z-index:2147483000;background:var(--bg,#f4eee3)";document.body.appendChild(bk);
        fr.src=href;bk.appendChild(fr);document.documentElement.style.overflow="hidden";
        fr.addEventListener("load",()=>{try{document.title=fr.contentDocument.title}catch(e){}sync()});syncT=setInterval(sync,300);
      }else{try{fr.contentWindow.location.replace(href)}catch(e){fr.src=href}}
    };
    JFS.go=href=>{
      const st=history.state&&history.state.jf?history.state:null;
      if(href.split("#")[0]===HOME){if(st&&st.i>0)history.go(-st.i);else close();return}
      const i=(st?st.i:0)+1;
      history.pushState({jf:href,i},"",href);show(href);
    };
    addEventListener("popstate",e=>{const s=e.state;if(s&&s.jf)show(s.jf);else close()});
    if(history.state&&history.state.jf)history.replaceState(null,"",HOME);
    /* jogo aberto diretamente (atalho, link de convite): o botão "voltar" do telemóvel leva ao menu em vez de sair do site */
    if(!document.querySelector("nav.games")&&document.querySelector('a[href="../"]')){
      const HUB=new URL("../",location.href).href,ref=(document.referrer||"").split("#")[0];
      if(ref!==HUB&&!(history.state&&history.state.jg)){const here=location.href;try{history.replaceState({jhub:1},"",HUB);history.pushState({jg:1},"",here)}catch(e){}}
      addEventListener("popstate",e=>{if(e.state&&e.state.jhub)location.replace(HUB)});
    }
    /* em ecrã completo, os links do site abrem na moldura */
    addEventListener("click",e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;if(!isFs()&&!fr&&!get())return;const a=e.target.closest&&e.target.closest("a[href]");const h=sameSite(a);if(!h)return;e.preventDefault();JFS.go(h)},false);
  }
  if(!can||APPFS)return;

  /* ---- botão ---- */
  const IN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  let btn=document.getElementById("fsBtn");
  if(btn){const c=btn.cloneNode(false);c.removeAttribute("aria-pressed");btn.replaceWith(c);btn=c} /* a Panela tinha o seu; passa a usar este */
  else{
    const tools=document.querySelector("header .tools");if(!tools)return;
    btn=document.createElement("button");btn.className="btn ghost sm ico";btn.id="fsBtn";btn.type="button";
    const tb=document.getElementById("themeBtn");tools.insertBefore(btn,tb||null);
  }
  const st=document.createElement("style");
  st.textContent="#fsBtn{display:inline-grid;place-items:center}#fsBtn[hidden]{display:none}#fsBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}";
  document.head.appendChild(st);
  const upd=()=>{const f=isFs();btn.innerHTML=f?OUT:IN;btn.title=f?"Sair do ecrã completo":"Ecrã completo";btn.setAttribute("aria-label",btn.title);if(window.dispatchEvent)setTimeout(()=>dispatchEvent(new Event("resize")),250)};
  upd();D.addEventListener("fullscreenchange",upd);D.addEventListener("webkitfullscreenchange",upd);
  btn.hidden=false;
  btn.addEventListener("click",()=>{const f=isFs();set(!f);f?leave():enter()});
  if(TOP)return;
  /* guardar a escolha */
  let leaving=false;addEventListener("pagehide",()=>{leaving=true});
  const onChange=()=>{if(!isFs()&&!leaving&&document.visibilityState==="visible")set(false)};
  document.addEventListener("fullscreenchange",onChange);document.addEventListener("webkitfullscreenchange",onChange);
  /* se mesmo assim mudou de página: volta a entrar no primeiro toque */
  if(get()&&!isFs()){
    const off=()=>{removeEventListener("click",once,true);removeEventListener("touchend",once,true)};
    const once=e=>{if(e.target&&e.target.closest&&e.target.closest("#fsBtn"))return;off();if(!isFs())enter()};
    addEventListener("click",once,true);addEventListener("touchend",once,true);
  }
})();
